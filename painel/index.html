<title>Painel euSUPER!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

<style>
/* =========================================================================
   Identidade visual euSUPER! — Manual da Identidade Visual 2026.
   Paleta oficial: Azul #008CF5 (gradiente até #1760B9), Laranja #F9902A,
   Verde #05B27C, Cinza #87B1DB, Azul Claro #D7FFF7, Branco #FEFEFE.
   Tipografia oficial: Gilroy. Como a Gilroy é licenciada e não existe no
   Google Fonts, a Poppins (geométrica equivalente) responde por ela;
   quando a Gilroy for licenciada, basta o navegador tê-la instalada —
   ela vem primeiro na pilha da --fonte.
   ========================================================================= */
:root{
  --fonte:"Gilroy","Poppins",-apple-system,"Segoe UI",sans-serif;
  --menta:#D7FFF7; --casca:#FEFEFE; --tela:#F2FBF9; --cartao:#FEFEFE;
  --mata:#008CF5; --mata-2:#1760B9; --titulo:#1760B9; --cta:#F9902A;
  --borda:#DFEDF9; --borda-2:#EAF4FB;
  --texto:#123F7C; --texto-2:#4A76A8; --texto-3:#87B1DB; --trilho:#E2F1FA;
  --d1:#008CF5; --d2:#F9902A; --d3:#05B27C;
  --bom:#03875F; --ruim:#C05E0F; --bom-t:#DCF5EC; --ruim-t:#FDEEDD;
  --av:#B36B10; --av-t:#FDF1E0;
  --sombra:0 1px 2px rgba(18,63,124,.05), 0 8px 24px -8px rgba(18,63,124,.10);
  --menu:rgba(255,255,255,.74); --menu-bg:rgba(255,255,255,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --menta:#04182B; --casca:#0A2138; --tela:#071D31; --cartao:#0F2A44;
  --mata:#1273CE; --mata-2:#0F3F7D; --titulo:#4FB1FF; --cta:#F9902A;
  --borda:#1C3A5A; --borda-2:#163049;
  --texto:#E3F1FE; --texto-2:#9DC1E3; --texto-3:#6E93BC; --trilho:#1C3B5C;
  --d1:#3FA9FF; --d2:#FFA14E; --d3:#17C68E;
  --bom:#2ECD9A; --ruim:#FF9E55; --bom-t:#0B3229; --ruim-t:#39230F;
  --av:#F2B04E; --av-t:#33260F;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --menu:rgba(227,241,254,.62); --menu-bg:rgba(255,255,255,.10);
}}
:root[data-theme="dark"]{
  --menta:#04182B; --casca:#0A2138; --tela:#071D31; --cartao:#0F2A44;
  --mata:#1273CE; --mata-2:#0F3F7D; --titulo:#4FB1FF; --cta:#F9902A;
  --borda:#1C3A5A; --borda-2:#163049;
  --texto:#E3F1FE; --texto-2:#9DC1E3; --texto-3:#6E93BC; --trilho:#1C3B5C;
  --d1:#3FA9FF; --d2:#FFA14E; --d3:#17C68E;
  --bom:#2ECD9A; --ruim:#FF9E55; --bom-t:#0B3229; --ruim-t:#39230F;
  --av:#F2B04E; --av-t:#33260F;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --menu:rgba(227,241,254,.62); --menu-bg:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
/* o hidden tem de vencer qualquer display do componente (.cd e flex, por
   exemplo). O wrapper do artifact publicado ja faz isso; o arquivo solto nao,
   e sem esta linha o campo de comparacao nao sumia fora do claude.ai */
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--menta);color:var(--texto);margin:0;padding:20px;overflow:hidden;
  font-family:var(--fonte);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
@supports (height:100dvh){html,body{height:100dvh}}
.rola{scrollbar-width:thin;scrollbar-color:var(--trilho) transparent}
.rola::-webkit-scrollbar{width:10px;height:10px}
.rola::-webkit-scrollbar-track{background:transparent}
.rola::-webkit-scrollbar-thumb{background:var(--trilho);border-radius:99px;
  border:3px solid transparent;background-clip:content-box}

.app{max-width:1240px;height:100%;margin:0 auto;background:var(--casca);border-radius:26px;
  box-shadow:0 2px 6px rgba(18,63,124,.06),0 24px 60px -20px rgba(18,63,124,.20);
  display:grid;grid-template-columns:214px minmax(0,1fr);overflow:hidden}

/* gradiente institucional + a exclamação "estourada" do manual, como camadas
   de fundo (barra a 22,5° e círculo), para nunca criar scroll no menu */
.lado{padding:24px 14px 18px;display:flex;flex-direction:column;
  gap:24px;overflow-y:auto;min-height:0;
  background:
    linear-gradient(112.5deg,transparent 55%,rgba(255,255,255,.06) 55%,
      rgba(255,255,255,.06) 78%,transparent 78%),
    radial-gradient(circle 44px at 88% 97%,rgba(255,255,255,.08) 98%,transparent 100%),
    linear-gradient(168deg,var(--mata),var(--mata-2))}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.logo .b{width:31px;height:31px;border-radius:10px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;flex:none}
/* wordmark do manual: "eu" minúsculo, "SUPER" em caixa alta e a exclamação
   inclinada nos 22,5° originais do logotipo */
.logo b{font-family:var(--fonte);font-weight:800;font-size:16px;line-height:1.1;
  letter-spacing:-.02em}
.logo b .ex{display:inline-block;transform:rotate(22.5deg);transform-origin:50% 78%;
  margin-left:1px}
.logo small{display:block;font-size:10px;font-weight:500;color:var(--menu);margin-top:1px}
.menu{display:flex;flex-direction:column;gap:3px;flex:1}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border-radius:11px;
  border:none;background:none;cursor:pointer;font-family:var(--fonte);
  font-size:13.5px;font-weight:600;color:var(--menu);text-align:left;position:relative}
.item svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
/* logos oficiais dos canais: preenchidos, sem o traço herdado dos ícones genéricos */
.item svg.marca{stroke:none;stroke-width:0;fill:currentColor}
.item .icb{width:26px;height:26px;display:grid;place-items:center;flex:none;margin:-4px 0}
/* o manual só permite marca colorida sobre fundo branco — por isso o chip
   atrás dos logos dos canais, que somem sobre o azul institucional */
.item .icb.fundo{background:#FEFEFE;border-radius:8px;
  box-shadow:0 1px 2px rgba(18,63,124,.22)}
.item .icb.fundo svg{width:17px;height:17px}
.item .lbl{white-space:nowrap}
.item:hover,.item[aria-selected="true"]{background:var(--menu-bg);color:#fff}
.item .pt{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0}
.item[aria-selected="true"] .pt{opacity:1}
.item:focus-visible{outline:2px solid #fff;outline-offset:1px}

.tela{background:var(--tela);display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-width:0;overflow:hidden}

/* ---------------- barra de consulta: é o coração do painel ---------------- */
.consulta{background:var(--cartao);border-bottom:1px solid var(--borda);
  padding:16px 22px 13px;display:flex;flex-direction:column;gap:10px}
.c-linha{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}

/* par de datas como um campo só, com o rótulo dentro */
.cd{display:flex;flex-direction:column;justify-content:center;gap:3px;
  background:var(--tela);border:1px solid var(--borda);border-radius:13px;
  padding:8px 15px;transition:border-color .15s}
.cd:hover{border-color:var(--texto-3)}
.cd:focus-within{border-color:var(--mata);box-shadow:0 0 0 3px
  color-mix(in srgb, var(--mata) 14%, transparent)}
.cd-l{font-family:var(--fonte);font-size:11px;font-weight:600;color:var(--texto-2);line-height:1}
.cd-v{display:flex;align-items:center;gap:7px}
.cd input[type=date]{font-family:var(--fonte);font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;border:none;background:none;padding:0;margin:0;
  color:var(--texto);letter-spacing:-.01em;width:8.6em}
.cd input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
.cd input[type=date]:focus-visible{outline:none}
.cd-seta{color:var(--texto-3);font-size:12px}
/* a barra como frase: período em destaque, comparação discreta, edição sob demanda */
.per{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;flex:1 1 280px;
  margin-right:auto;align-self:center}
/* o pontilhado discreto em repouso diz "isto se edita"; escurece no hover e aberto */
.per button{font-family:var(--fonte);border:none;background:none;padding:0 0 2px;cursor:pointer;
  color:inherit;border-bottom:2px dotted color-mix(in srgb,var(--texto-3) 55%,transparent);
  line-height:1.15;text-align:left;transition:border-color .15s}
.per button:hover,.per button[aria-expanded="true"]{border-bottom-color:var(--texto-2)}
.per button:focus-visible{outline:2px solid var(--mata);outline-offset:3px;border-radius:4px}
.per .p1{font-size:clamp(19px,1.7vw,24px);font-weight:800;letter-spacing:-.03em;color:var(--titulo)}
.per .lig{font-size:13px;color:var(--texto-2);font-weight:500}
.per .p2{font-size:clamp(15px,1.3vw,18px);font-weight:700;letter-spacing:-.02em;color:var(--texto-2)}
.atalhos{display:flex;gap:4px}
.atalhos button{font-family:var(--fonte);font-size:12.5px;font-weight:600;color:var(--texto-2);background:none;
  border:1px solid transparent;border-radius:9px;padding:8px 11px;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s}
.atalhos button:hover{background:var(--tela);border-color:var(--borda);color:var(--texto)}
.atalhos button:focus-visible{outline:2px solid var(--mata);outline-offset:1px}
/* uma frase de estado no lugar dos chips */
.estado-l{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:12.5px;color:var(--texto-2);line-height:1.45}
.estado-l i{width:7px;height:7px;border-radius:50%;background:var(--texto-3);flex:none;margin-top:6px}
.estado-l.vivo i{background:var(--bom)} .estado-l.novo i{background:var(--titulo)} .estado-l.mal i{background:var(--ruim)}
.estado-l b{font-weight:600;color:var(--texto)}
.estado-l small{font-size:inherit;color:var(--texto-2)}
/* modo de edição: aparece ao clicar no período, some ao aplicar */
.edicao{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--borda)}
.edicao[hidden]{display:none}
.ed-acoes{display:flex;gap:6px}
.edicao .ok{font-family:var(--fonte);font-size:12.5px;font-weight:700;color:var(--titulo);background:none;
  border:1px solid var(--borda);border-radius:9px;padding:9px 13px;cursor:pointer}
.edicao .ok:hover{background:var(--tela)}
.edicao .cancelar{font-family:var(--fonte);font-size:12.5px;font-weight:600;color:var(--texto-2);background:none;
  border:1px solid transparent;border-radius:9px;padding:9px 11px;cursor:pointer}
.edicao .cancelar:hover{color:var(--texto);border-color:var(--borda)}
.edicao .ok:focus-visible,.edicao .cancelar:focus-visible{outline:2px solid var(--mata);outline-offset:1px}
/* liga/desliga a comparacao: sem ela o painel mostra um periodo so */
.cmp{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--fonte);font-size:12.5px;font-weight:600;color:var(--texto-2);
  background:var(--tela);border:1px solid var(--borda);border-radius:11px;padding:9px 13px;
  white-space:nowrap;user-select:none}
.cmp:hover{border-color:var(--texto-3);color:var(--texto)}
.cmp input{width:15px;height:15px;margin:0;accent-color:var(--mata);cursor:pointer;flex:none}
.cmp:has(input:checked){color:var(--texto);border-color:var(--mata)}
.cmp:focus-within{box-shadow:0 0 0 3px color-mix(in srgb, var(--mata) 14%, transparent)}
/* botao que abre a edicao das datas — sem ele o pontilhado do periodo era a
   unica pista de que as datas se editam, e nao era pista suficiente */
.atalhos .abrir{display:inline-flex;align-items:center;gap:6px}
.atalhos .abrir svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.atalhos button[aria-expanded="true"]{background:var(--tela);border-color:var(--mata);color:var(--titulo)}
.puxar{font-family:var(--fonte);font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:10px;border:none;background:var(--cta);color:#fff;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.puxar:hover{filter:brightness(1.06)}
.puxar:disabled{opacity:.6;cursor:default}
.puxar:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.puxar .gira{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite;display:none}
.puxar.indo .gira{display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.ferram{display:flex;gap:8px;margin-left:auto;align-items:center}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--borda);background:var(--cartao);
  cursor:pointer;display:grid;place-items:center;color:var(--texto-2)}
.ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;
  stroke-linejoin:round}
.ic:focus-visible{outline:2px solid var(--mata);outline-offset:1px}
.eu{width:36px;height:36px;border-radius:50%;background:var(--mata);color:#fff;display:grid;
  place-items:center;font-family:var(--fonte);font-weight:700;font-size:12px}
#main{overflow-y:auto;overflow-x:hidden;min-height:0;padding:20px 22px 28px;
  overscroll-behavior:contain}
.folha[hidden]{display:none}
.faixa{display:grid;gap:14px;margin-bottom:14px}
.faixa.dois{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

.cx{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:19px 21px;
  box-shadow:var(--sombra);min-width:0}
.cx h3{font-family:var(--fonte);font-size:14px;font-weight:700;margin:0;color:var(--titulo)}
.cx .sub{font-size:12.5px;color:var(--texto-3);margin:3px 0 0}
.cxt{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.selo{font-family:var(--fonte);font-size:11px;font-weight:700;padding:5px 10px;
  border-radius:8px;background:var(--trilho);color:var(--texto-2);white-space:nowrap}
.proc{font-size:11px;color:var(--texto-3);margin:15px 0 0;padding-top:12px;
  border-top:1px solid var(--borda-2);line-height:1.5}
.falhou{background:var(--ruim-t);color:var(--ruim);border-radius:10px;padding:11px 14px;
  font-size:12.5px;margin:0 0 14px;line-height:1.5}
.falhou b{display:block;margin-bottom:3px}
.aviso{background:var(--av-t);color:var(--av);border-radius:10px;padding:11px 14px;
  font-size:12.5px;margin:0 0 14px;line-height:1.5}

/* ---- blocos de métrica: cada métrica no seu próprio cartão ---- */
.blocos{display:flex;flex-wrap:wrap;gap:12px}
.bl{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;
  box-shadow:var(--sombra);padding:17px 19px 15px;display:flex;flex-direction:column;
  flex:1 1 260px;min-width:0}   /* 260px: cabe "R$ 1.883,54" nas duas colunas */
.bl-r{font-family:var(--fonte);font-size:11.5px;font-weight:700;
  color:var(--texto-2);margin-bottom:8px;line-height:1.3}
/* o traço a 22,5° da iconografia da marca marcando cada métrica */
.bl-r::before{content:"";display:inline-block;width:5px;height:9px;margin-right:7px;
  background:var(--d1);transform:skewX(-22.5deg);border-radius:1.5px}
.bl-v{font-family:var(--fonte);font-weight:800;
  font-size:clamp(17px,1.45vw,20px);letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* lado a lado: atual à esquerda, comparação à direita, números na mesma linha de base */
/* grade de 2 colunas: 1ª linha os rótulos dos períodos, 2ª linha os números,
   alinhados pela linha de base — assim nada fica torto entre as colunas */
.bl-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;
  align-items:baseline;margin-top:6px}
.bl-2.so{grid-template-columns:minmax(0,1fr)}
.bl-k{font-family:var(--fonte);font-size:10.5px;font-weight:600;color:var(--texto-3);
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bl-k.atual{color:var(--mata)}
.bl-v2{font-family:var(--fonte);font-weight:700;font-size:clamp(15px,1.25vw,17px);
  letter-spacing:-.02em;line-height:1.1;color:var(--texto-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* a seta é só um sinal discreto ao lado do número atual */
.bl-seta{font-size:9px;line-height:1;margin-left:5px;vertical-align:middle;font-style:normal}
.bl-seta.up{color:var(--bom)} .bl-seta.down{color:var(--ruim)} .bl-seta.flat{color:var(--texto-3)}
.bl-e{font-size:11px;color:var(--texto-3);margin-top:11px;line-height:1.45}
/* ---- visão geral: cartões por canal, barras empilhadas, tabela com destaque ---- */
.canais{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.canal{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;box-shadow:var(--sombra);
  padding:18px 19px 16px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:14px;min-width:0}
.canal header{display:flex;align-items:center;gap:11px}
.canal header b{display:block;font-family:var(--fonte);font-size:14.5px;font-weight:700;color:var(--texto);line-height:1.2}
.canal header small{display:block;font-size:10.5px;color:var(--texto-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canal header div{min-width:0}
.clogo{width:32px;height:32px;border-radius:9px;background:#FEFEFE;border:1px solid var(--borda);display:grid;
  place-items:center;flex:none}
.clogo svg{width:18px;height:18px;fill:currentColor;stroke:none;color:#000}
.canal .k{display:block;font-family:var(--fonte);font-size:10.5px;font-weight:600;color:var(--texto-3);line-height:1.2}
.canal .k2{display:block;font-size:11px;color:var(--texto-2);margin-top:6px}
.canal .cinv .v{display:block;font-family:var(--fonte);font-size:clamp(20px,1.8vw,26px);font-weight:800;
  letter-spacing:-.03em;line-height:1.1;color:var(--texto);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.canal .fx{display:block;height:8px;border-radius:99px;background:var(--trilho);overflow:hidden}
.canal .fx i{display:block;height:100%;border-radius:99px;background:var(--c)}
.cmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px;border-top:1px solid var(--borda-2)}
.cmini .v{display:block;font-family:var(--fonte);font-size:15px;font-weight:700;color:var(--texto);
  margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.legenda{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--texto-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.emp{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--borda-2)}
.emp:last-child{border-bottom:none}
.emp-r{font-family:var(--fonte);font-size:12.5px;font-weight:700;color:var(--texto)}
.emp-b{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--trilho)}
.emp-b i{display:flex;align-items:center;justify-content:center;height:100%;min-width:0;overflow:hidden}
.emp-b i+i{border-left:2px solid var(--cartao)}
.emp-b em{font-style:normal;font-family:var(--fonte);font-size:11px;font-weight:700;color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.15)}
.emp-t{font-family:var(--fonte);font-size:12.5px;font-weight:700;color:var(--texto-2);font-variant-numeric:tabular-nums;
  white-space:nowrap;min-width:84px;text-align:right}
.tcanal .tc{display:inline-flex;align-items:center;gap:10px}
.tcanal td.nm .tc>span{display:block;font-size:13px;font-weight:700;color:var(--texto);margin-top:0}

function vari(a,b,inv){
  if(a==null||b==null)return null;
  if(b===0) return a>0 ? {p:null,cls:inv?"down":"up",txt:"▲ vinha de 0"} : null;
  const p=((a-b)/Math.abs(b))*100, bom=inv?p<0:p>0;
  return {p, cls:Math.abs(p)<0.5?"flat":(bom?"up":"down"),
          txt:(p>0?"▲ ":p<0?"▼ ":"")+nf2.format(Math.abs(p)).replace(",00","")+"%"};
}

/* deriva o que é conta: nunca guardo CTR, CPC nem taxa — calculo sempre */
/* casa o anúncio com a miniatura embutida em CRIATIVOS; o Windsor devolve o
   nome longo da campanha e o retrato usa o curto, então o casamento é pelo
   núcleo que os dois têm em comum */
function nucleoCampanha(c){
  c=(c||"").toUpperCase();
  if(c.includes("PERFIL")){const m=c.match(/\[(\d+)\]/); return "PERFIL-"+(m?m[1]:"");}
  if(c.includes("SIGNUP")) return "SIGNUP";
  if(c.includes("DUDA"))   return "DUDA";
  if(c.includes("A/B"))    return "AB";
  return c.trim();
}
function criativoDe(c){
  return (typeof CRIATIVOS!=="undefined" &&
          CRIATIVOS[(c.nome||"")+"|"+nucleoCampanha(c.campanha)])||null;
}
/* a que grupo pertence uma campanha/anúncio: OUTCOME_TRAFFIC (ou nome com
   PERFIL/VISITA) é visita ao perfil; tudo o mais é cadastro */
function grupoCampanha(objetivo,nome){
  const o=(objetivo||"").toUpperCase(), n=(nome||"").toUpperCase();
  return (o==="OUTCOME_TRAFFIC"||/PERFIL|VISITA/.test(n)) ? "perfil" : "cadastro";
}

function derivar(x){
  if(!x) return null;
  return {...x,
    ctr:        div(x.cliques, x.impressoes)!=null ? div(x.cliques,x.impressoes)*100 : null,
    cpc:        div(x.custo, x.cliques),
    cpm:        div(x.custo, x.impressoes)!=null ? div(x.custo,x.impressoes)*1000 : null,
    txConv:     div(x.conversoes, x.cliques)!=null ? div(x.conversoes,x.cliques)*100 : null,
    custoConv:  div(x.custo, x.conversoes),
    frequencia: div(x.impressoes, x.alcance),
    connect:    div(x.visitasLP, x.cliques)!=null ? div(x.visitasLP,x.cliques)*100 : null,
    custoVisita:div(x.custo, x.visitasPerfil)
  };
}

const espera=ms=>new Promise(r=>setTimeout(r,ms));

async function chamar(server,tool,input,rotulo){
  if(!MCP) throw {code:"capability_disabled",rotulo};
  for(let t=0;t<2;t++){
    try{ return (await MCP.callTool(server,tool,input,{cache:{refresh:true}})).payload; }
    catch(e){
      const cod=e&&e.code;
      if(t===1 || !(e&&e.retryable===true || RETENTAVEL.has(cod)))
        throw {code:cod||"tool_error",message:e&&e.message,rotulo};
      await espera((e&&e.retryAfterMs)||700+Math.random()*600);
    }
  }
}

async function qGoogle(de,ate){
  const r=linhas(await chamar("Windsor.ai","get_data",{connector:"google_ads",
    accounts:[CONTAS.google],
    fields:["campaign","advertising_channel_type","impressions","clicks","cost","conversions"],
    date_from:de,date_to:ate},"Google Ads"));
  const rot=t=>t==="SEARCH"?"Pesquisa":t==="PERFORMANCE_MAX"?"Performance Max":
              t==="DEMAND_GEN"?"YouTube":(t||"Outra");
  const m={};
  r.forEach(x=>{const k=rot(x.advertising_channel_type);
    m[k]=m[k]||{nome:k,impressoes:0,cliques:0,custo:0,conversoes:0};
    m[k].impressoes+=+x.impressions||0; m[k].cliques+=+x.clicks||0;
    m[k].custo+=+x.cost||0; m[k].conversoes+=+x.conversions||0;});
  return {total:{impressoes:soma(r,x=>x.impressions),cliques:soma(r,x=>x.clicks),
                 custo:soma(r,x=>x.cost),conversoes:soma(r,x=>x.conversions)},
          campanhas:Object.values(m).sort((a,b)=>b.custo-a.custo)};
}

async function qMeta(de,ate){
  const base={connector:"facebook",accounts:[CONTAS.meta],date_from:de,date_to:ate};
  /* totais SEM dimensão: só assim o alcance vem deduplicado, igual ao Ads
     Manager — somar o alcance por anúncio conta a mesma pessoa várias vezes */
  /* com account_id o Windsor devolve UMA linha da conta inteira; sem dimensão
     nenhuma, janelas longas (um mês) voltavam fragmentadas em várias linhas */
  const totL=linhas(await chamar("Windsor.ai","get_data",{...base,
    fields:["account_id","spend","reach","impressions","actions_link_click",
            "actions_landing_page_view","actions_complete_registration"]},"Meta Ads"));
  const tot=totL.reduce((acc,x)=>{for(const k of ["spend","reach","impressions","actions_link_click",
    "actions_landing_page_view","actions_complete_registration"]) acc[k]=(+acc[k]||0)+(+x[k]||0); return acc;},{});
  const r=linhas(await chamar("Windsor.ai","get_data",{...base,
    fields:["campaign","campaign_objective","ad_name","spend","impressions",
            "actions_link_click","actions_complete_registration",
            "instagram_profile_visits","thumbnail_url","instagram_permalink_url"]},"Meta Ads"));
  /* por campanha, com o objetivo: separa cadastro (OUTCOME_SALES) de visita ao
     perfil (OUTCOME_TRAFFIC). O Windsor não deduplica alcance por grupo, então:
     se só um grupo gastou na janela, ele leva o alcance deduplicado da conta;
     se os dois gastaram, cada grupo soma o alcance das suas campanhas e avisa. */
  const camps=linhas(await chamar("Windsor.ai","get_data",{...base,
    fields:["campaign","campaign_objective","spend","reach","impressions",
            "actions_link_click","actions_landing_page_view",
            "actions_complete_registration","instagram_profile_visits"]},"Meta Ads"));
  const grupoDe=x=>grupoCampanha(x.campaign_objective,x.campaign);
  const acc={cadastro:null,perfil:null};
  camps.forEach(x=>{
    const g=grupoDe(x); const t=acc[g]||(acc[g]={alcance:0,impressoes:0,cliques:0,custo:0,
      conversoes:0,visitasLP:0,visitasPerfil:0,alcanceSomado:true});
    t.alcance+=+x.reach||0; t.impressoes+=+x.impressions||0; t.cliques+=+x.actions_link_click||0;
    t.custo+=+x.spend||0; t.conversoes+=+x.actions_complete_registration||0;
    t.visitasLP+=+x.actions_landing_page_view||0; t.visitasPerfil+=+x.instagram_profile_visits||0;
  });
  const ativos=Object.values(acc).filter(t=>t&&t.custo>0);
  if(ativos.length===1){ ativos[0].alcance=+tot.reach||ativos[0].alcance; ativos[0].alcanceSomado=false; }
  return {total:{alcance:+tot.reach||0,impressoes:+tot.impressions||0,
                 cliques:+tot.actions_link_click||0,custo:+tot.spend||0,
                 conversoes:+tot.actions_complete_registration||0,
                 visitasLP:+tot.actions_landing_page_view||0},
          grupos:acc,
          /* thumb/post: a imagem externa não carrega dentro do artifact,
             então servem só de link; a miniatura visível vem de CRIATIVOS */
          criativos:r.map(x=>({nome:x.ad_name,campanha:x.campaign,objetivo:x.campaign_objective||"",
            custo:+x.spend||0,impressoes:+x.impressions||0,cliques:+x.actions_link_click||0,
            conversoes:+x.actions_complete_registration||0,
            visitasPerfil:+x.instagram_profile_visits||0,
            thumb:x.thumbnail_url||"",post:x.instagram_permalink_url||""}))
            .sort((a,b)=>b.custo-a.custo)};
}

/* Instagram organico — conector "instagram" do Windsor (Instagram Insights).
   Sem pino de conta: so existe um perfil e o id muda a cada reconexao.
   Uma chamada por janela COM a data como dimensao: o Windsor devolve uma linha
   por dia e junta as duas tabelas de insight diario pela data. Somar dia a dia
   e exato para contagem (visualizacoes, curtidas, novos seguidores) e e SOMA
   para alcance e contas engajadas — o Instagram so entrega esses dois por dia
   e nao existe alcance deduplicado de periodo na API. Os blocos dizem isso. */
async function qInsta(de,ate){
  const r=linhas(await chamar("Windsor.ai","get_data",{connector:"instagram",
    fields:["date","reach","views","accounts_engaged",
            "total_interactions","likes","comments","saves","shares",
            "profile_links_taps"],
    date_from:de,date_to:ate},"Instagram"));
  if(!r.length) return null;   /* sem linha nenhuma nao invento zero */
  return {dias:r.length,
    alcance:soma(r,x=>x.reach), visualizacoes:soma(r,x=>x.views),
    novosSeguidores:null,   /* chega da chamada separada, em puxar() */
    contasEngajadas:soma(r,x=>x.accounts_engaged),
    interacoes:soma(r,x=>x.total_interactions),
    curtidas:soma(r,x=>x.likes), comentarios:soma(r,x=>x.comments),
    salvamentos:soma(r,x=>x.saves), compartilhamentos:soma(r,x=>x.shares),
    toquesLinks:soma(r,x=>x.profile_links_taps)};
}
/* Novos seguidores vem SOZINHO, numa chamada que cobre as duas janelas de uma
   vez (a separacao e feita aqui pela data). Motivo: o Instagram recusa o campo
   follower_count para qualquer janela que passe de 30 dias atras e derruba a
   consulta inteira junto — isolado, se ele falhar o resto da aba continua. */
async function qInstaSeguidores(de,ate,cde,cate){
  const cmp=!!(cde&&cate);
  const ini=cmp?[de,cde].sort()[0]:de, fim=cmp?[ate,cate].sort()[1]:ate;
  const r=linhas(await chamar("Windsor.ai","get_data",{connector:"instagram",
    fields:["date","follower_count"],date_from:ini,date_to:fim},
    "Instagram · novos seguidores"));
  const janela=(a,b)=>{const f=r.filter(x=>x.date>=a&&x.date<=b);
    return f.length?soma(f,x=>x.follower_count):null};
  return {atual:janela(de,ate), anterior:cmp?janela(cde,cate):null};
}

function sqlNegocio(de,ate,cde,cate){
  /* sem comparacao a CTE tem uma linha so — nao invento uma janela anterior */
  const j = (cde&&cate)
    ? `SELECT 'atual'::text AS janela, DATE '${de}' AS de, DATE '${ate}' AS ate
  UNION ALL SELECT 'anterior', DATE '${cde}', DATE '${cate}'`
    : `SELECT 'atual'::text AS janela, DATE '${de}' AS de, DATE '${ate}' AS ate`;
  return `WITH j AS (${j}),
teste AS (SELECT unnest(ARRAY[${IDS_TESTE}]) AS id)
SELECT j.janela,
 (SELECT count(*) FROM professional p WHERE p.deleted_at IS NULL
   AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate) AS cadastros,
 (SELECT count(*) FROM professional p WHERE p.deleted_at IS NULL
   AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate
   AND p.onboarding_step = 'FINISHED') AS onboarding,
 (SELECT count(*) FROM professional p JOIN professional_account a ON a.professional_id = p.id
   WHERE p.deleted_at IS NULL AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate AND a.status = 'ACTIVE') AS contas_ativas,
 (SELECT count(*) FROM checkout_session c WHERE c.paid_at IS NOT NULL
   AND c.paid_at::date BETWEEN j.de AND j.ate) AS pagamentos,
 (SELECT COALESCE(sum((c.price->>'amount')::numeric),0)/100 FROM checkout_session c
   WHERE c.paid_at IS NOT NULL AND c.paid_at::date BETWEEN j.de AND j.ate) AS gmv
FROM j ORDER BY j.janela DESC`;
}
async function qNegocio(de,ate,cde,cate){
  const p=await chamar("Metabase","execute_sql",
    {database_id:CONTAS.metabaseDb,sql:sqlNegocio(de,ate,cde,cate)},"Negócio");
  const rows=(p&&p.data&&Array.isArray(p.data.rows))?p.data.rows:[];
  const ler=n=>{const l=rows.find(r=>r[0]===n);
    return l?{cadastros:+l[1],onboarding:+l[2],contasAtivas:+l[3],pagamentos:+l[4],gmv:+l[5]}:null};
  return {atual:ler("atual"),anterior:ler("anterior")};
}

async function puxar(){
  const de=inDe.value,ate=inAte.value,cde=inCDe.value,cate=inCAte.value;
  const cmp=comparar;
  const validas = cmp ? [de,ate,cde,cate].every(dataOk)&&de<=ate&&cde<=cate
                      : [de,ate].every(dataOk)&&de<=ate;
  if(!validas){
    FALHAS={periodo:{rotulo:"Período",code:"bad_request"}}; desenhar(); return;
  }
  btPuxar.disabled=true; btPuxar.classList.add("indo"); txPuxar.textContent="Puxando…";
  FALHAS={};
  /* as janelas "B" só entram quando há comparação: dez chamadas em vez de
     dezoito. qClarity() saiu: a Landing Page é só o export mensal */
  const tarefas=[
    ["gA",()=>qGoogle(de,ate)],
    ["mA",()=>qMeta(de,ate)],
    ["oA",()=>qOpenai(de,ate)],
    ["sA",()=>qSessoes(de,ate)],
    ["ng",()=>qNegocio(de,ate,cmp?cde:null,cmp?cate:null)]
  ];
  /* aba oculta não desenha nada, então consultá-la seria gasto puro: as cinco
     chamadas do Instagram só entram enquanto a aba estiver visível. Basta tirar
     o oculta:true da lista VISTAS para elas voltarem. */
  if(visivel("insta")){
    tarefas.push(
      ["iA",()=>qInsta(de,ate)],
      ["iP",()=>qInstaPosts(de,ate)], ["iU",()=>qInstaPerfil(de,ate)],
      ["iS",()=>qInstaSeguidores(de,ate,cmp?cde:null,cmp?cate:null)]);
    if(cmp) tarefas.push(["iB",()=>qInsta(cde,cate)]);
  }
  if(cmp) tarefas.push(
    ["gB",()=>qGoogle(cde,cate)], ["mB",()=>qMeta(cde,cate)],
    ["oB",()=>qOpenai(cde,cate)], ["sB",()=>qSessoes(cde,cate)]);
  const R={};
  await Promise.all(tarefas.map(async([k,f])=>{
    try{ R[k]=await f() }catch(e){ R[k]=null; FALHAS[k]=e }
  }));

  const novo=JSON.parse(JSON.stringify(RETRATO));
  const ag=new Date(), z=n=>String(n).padStart(2,"0");
  novo.aoVivo=true;
  novo.puxadoEm=`consultado em ${z(ag.getDate())}/${z(ag.getMonth()+1)} às ${z(ag.getHours())}:${z(ag.getMinutes())}`;
  novo.periodo={atual:{de,ate},anterior:cmp?{de:cde,ate:cate}:null};
  novo.google={atual:R.gA&&R.gA.total, anterior:R.gB&&R.gB.total,
    campanhas:(R.gA&&R.gA.campanhas)||[], erro:msg("gA")};
  novo.meta={atual:R.mA&&R.mA.total, anterior:R.mB&&R.mB.total,
    criativos:(R.mA&&R.mA.criativos)||[], criativosAnt:(R.mB&&R.mB.criativos)||[], erro:msg("mA"),
    grupos:{
      cadastro:{atual:R.mA&&R.mA.grupos.cadastro, anterior:R.mB&&R.mB.grupos.cadastro},
      perfil:  {atual:R.mA&&R.mA.grupos.perfil,   anterior:R.mB&&R.mB.grupos.perfil}
    }};
  novo.openai={atual:R.oA&&R.oA.total, anterior:R.oB&&R.oB.total, erro:msg("oA")};
  novo.lp={sessoes:{atual:R.sA,anterior:R.sB}, clarity:null, erroSessoes:msg("sA")};
  if(R.iA&&R.iS) R.iA.novosSeguidores=R.iS.atual;
  if(R.iB&&R.iS) R.iB.novosSeguidores=R.iS.anterior;
  novo.instagram={atual:R.iA||null, anterior:R.iB||null, posts:R.iP||[],
    perfil:R.iU||null, erro:msg("iA")||msg("iP")||msg("iU"),
    erroSeguidores:msg("iS")};
  novo.negocio={atual:(R.ng&&R.ng.atual)||null, anterior:(R.ng&&R.ng.anterior)||null,
    erro:msg("ng")};
  novo.gmvSemanal=RETRATO.gmvSemanal; novo.passos=RETRATO.passos;
  novo.falhouTudo = tarefas.every(([k])=>FALHAS[k]);
  D=novo; guardarVivo(novo); lembrarDatas();
  btPuxar.disabled=false; btPuxar.classList.remove("indo"); txPuxar.textContent="Puxar dados";
  desenhar();
}
const msg=k=>{
  const f=FALHAS[k]; if(!f) return null;
  if(f.code==="tool_error" && f.message) return f.message;
  return CONSERTO[f.code]||f.message||"não veio";
};

/* ------------------------------------------------------------- componentes */
const cx=(i,c)=>`<section class="cx ${c||""}">${i}</section>`;
const cxt=(t,s,se)=>`<div class="cxt"><div><h3>${t}</h3>${s?`<p class="sub">${s}</p>`:""}</div>${se?`<span class="selo">${se}</span>`:""}</div>`;

/* bloco de métrica: valor de agora, o NÚMERO REAL do período de comparação
   (nada de porcentagem — pedido dos founders) e uma linha dizendo o que é.
   modo: "inv" = cair é bom (custos) · "neutro" = sem julgamento (investimento) */
function rotuloAnt(){
  const pa=D.periodo.anterior;
  if(pa && ehMesCalendario(pa.de,pa.ate))
    return new Date(pa.de+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"});
  return "anterior";
}
/* rótulo curto de um período: nome do mês se for mês-calendário ("Agosto"),
   senão as datas ("24/08–30/08") — é o que encabeça cada número no bloco */
function rotuloPer(p){
  if(!p||!p.de||!p.ate) return "";
  if(ehMesCalendario(p.de,p.ate)){
    const m=new Date(p.de+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"});
    return m.charAt(0).toUpperCase()+m.slice(1);
  }
  return `${dm(p.de)}–${dm(p.ate)}`;
}
/* bloco de métrica "lado a lado": o período atual à esquerda, em destaque,
   e o de comparação à direita, cada um com seu rótulo e seu número real. A seta
   pequena ao lado do número atual diz se melhorou (verde) ou piorou (laranja),
   respeitando métricas em que cair é bom (modo "inv") */
function B(rot,fmt,a,b,expl,modo,rotulos){
  let seta="";
  /* a comparacao e feita sobre o valor JA formatado: se os dois numeros
     aparecem iguais na tela (1,3 e 1,3, arredondados de 1,25 e 1,31), uma seta
     contradiria o que esta escrito */
  if(a!=null && b!=null && fmt(a)!==fmt(b)){
    const subiu=a>b;
    const bom = modo==="neutro" ? null : (modo==="inv" ? !subiu : subiu);
    const cls = bom==null ? "flat" : (bom ? "up" : "down");
    seta=`<i class="bl-seta ${cls}" title="${subiu?"Subiu":"Caiu"} em relação ao período de comparação">${subiu?"▲":"▼"}</i>`;
  }
  const per=(D&&D.periodo)||{};
  /* rotulos: bloco que vem de um export tem janela própria e não a do painel —
     a Landing Page, por exemplo, cobre 07 a 14/09 enquanto a barra diz 08 a 14 */
  const dois = rotulos ? true : !!per.anterior;
  const la = rotulos ? rotulos.a : (rotuloPer(per.atual)||"Atual");
  const lb = rotulos ? rotulos.b : (rotuloPer(per.anterior)||"Anterior");
  return `<div class="bl">
    <div class="bl-r">${rot}</div>
    <div class="bl-2${dois?"":" so"}">
      <span class="bl-k atual">${la}</span>${dois?`<span class="bl-k">${lb}</span>`:""}
      <span class="bl-v">${fmt(a)}${seta}</span>${dois?`<span class="bl-v2">${fmt(b)}</span>`:""}
    </div>
    ${expl?`<div class="bl-e">${expl}</div>`:""}
  </div>`;
}
const blocos=h=>`<div class="blocos">${h}</div>`;

function semDados(rotulo,motivo){
  return cx(cxt(rotulo,"Este canal não trouxe dados nesta janela.")
    + `<p class="falhou"><b>Não foi possível ler</b>${esc(motivo||"sem dados no período")}</p>`);
}
function resumoCx(texto){
  return cx(cxt("O que esses números dizem","Leitura direta, sem jargão.")
    + `<div class="leitura">${texto}</div>`);
}

      : esc("Com os três canais somados, o investimento ficou estável (R$ 1.883 contra R$ 1.877), mas os cadastros caíram pela metade: 65 contra 128 — o custo por cadastro foi de R$ 14,66 para R$ 28,98. Houve troca de canal: Performance Max, Visita ao Perfil e o OpenAI (pausado de 24 a 28/08) saíram de cena, e o Meta mais que dobrou de verba. Do lado bom, o Google Pesquisa voltou a converter e o GMV subiu 77%.")}</p>
    <div class="nota"><div class="et">Observação do período</div>
      <textarea id="obs" placeholder="Ex: agosto foi atípico — houve um erro de tratamento nas duas últimas semanas, então parte dos dados não reflete operação normal."></textarea></div>
  </div>

  ${D.negocio&&D.negocio.erro?`<p class="falhou"><b>Dados de negócio não vieram</b>${esc(D.negocio.erro)}</p>`:""}
  ${blocos(
    B("Investimento",brl,inv,invB,"Soma dos três canais","neutro") +
    B("Cadastros novos",num,n?n.cadastros:null,nB?nB.cadastros:null,"Profissionais que entraram") +
    B("Custo por cadastro",brl,cpc,cpcB,"Investimento ÷ cadastros","inv") +
    B("Pagamentos",num,n?n.pagamentos:null,nB?nB.pagamentos:null,"Transações concluídas") +
    B("GMV",brl,n?n.gmv:null,nB?nB.gmv:null,"Valor que passou pelo produto")
  )}

  <div class="faixa dois" style="margin-top:14px">
    ${cx(cxt("Do visitante ao profissional pagando","Quantas pessoas sobram em cada etapa.")
      + (et.length? et.map(e=>`<div class="linha"><span class="ln">${esc(e.n)}</span>
          <span class="lt"><span class="lf" style="width:${Math.max((e.v||0)/maxE*100,2)}%;background:var(--d1)"></span></span>
          <span class="lv">${num(e.v)}</span></div>`).join("")
        : `<p class="vazio">Sem dados de negócio nesta consulta.</p>`))}
    ${cx(cxt("Onde o dinheiro foi","Gasto por canal no período.")
      + (canais.length? canais.map(c=>`<div class="linha"><span class="ln">${esc(c.n)}</span>
          <span class="lt"><span class="lf" style="width:${Math.max(c.d.custo/maxC*100,2)}%;background:${c.cor}"></span></span>
          <span class="lv">${brl(c.d.custo)}</span></div>`).join("")
        : `<p class="vazio">Nenhum canal trouxe dados.</p>`))}
  </div>

  <div class="faixa">
    ${cx(cxt("GMV por semana","Quanto passou pelo produto, semana a semana.",`${gmv.length} semanas`)
      + `<div class="bars">${gmv.map((s,i)=>`<div class="bc ${i===ult?"on":""}" title="${s.semana}: ${brl(s.gmv)}">
          <span class="bv">${nf0.format(s.gmv)}</span>
          <span class="bb" style="height:${Math.max(s.gmv/mx*100,3)}%"></span></div>`).join("")}</div>
        <div class="blabs">${gmv.map(s=>`<span>${s.semana}</span>`).join("")}</div>`
      + `<p class="proc">Série gravada — as seis semanas não vêm da consulta ao vivo.</p>`)}

}

/* --------------------------------------------------------------- Meta Ads */
function vMeta(){
  const a=derivar(D.meta&&D.meta.atual), b=derivar(D.meta&&D.meta.anterior);
  if(!a) return semDados("Meta Ads", D.meta&&D.meta.erro);
  const cri=(D.meta.criativos||[]).map(derivar).filter(c=>c.custo>0);

  /* dois grupos, como o Alysson apresenta: cadastro (conversão) e visita ao
     perfil do Instagram (tráfego). Cada um com seus blocos e seu título. */
  const G=(D.meta.grupos)||{};
  const gc=G.cadastro||{}, gp=G.perfil||{};
  const ca=derivar(gc.atual), cb=derivar(gc.anterior);
  const pa=derivar(gp.atual), pb=derivar(gp.anterior);
  const alcExpl=(x,y)=>(x&&x.alcanceSomado)||(y&&y.alcanceSomado)
    ? "Pessoas diferentes que viram — soma das campanhas do grupo"
    : "Pessoas diferentes que viram";
  const semAtual=(g,x)=>x?"":(g&&g.nota)||"Sem investimento no período atual.";
  const titulo=tituloGrupo;

  const blocosCadastro = (ca||cb) ? blocos(
    B("Alcance",num,ca&&ca.alcance,cb&&cb.alcance,alcExpl(ca,cb)) +
    B("Impressões",num,ca&&ca.impressoes,cb&&cb.impressoes,"Vezes que o anúncio apareceu") +
    B("Frequência",v=>v!=null?nf1.format(v):"—",ca&&ca.frequencia,cb&&cb.frequencia,"Vezes que a mesma pessoa viu","inv") +
    B("CPM",brl,ca&&ca.cpm,cb&&cb.cpm,"Custo para aparecer mil vezes","inv") +
    B("Cliques no link",num,ca&&ca.cliques,cb&&cb.cliques,"Quantas pessoas clicaram") +
    B("CTR",pct,ca&&ca.ctr,cb&&cb.ctr,"De 100 que viram, quantos clicaram") +
    B("Chegaram na página",pct,ca&&ca.connect,cb&&cb.connect,"Cliques que viraram visita de verdade") +
    B("Conversões",num,ca&&ca.conversoes,cb&&cb.conversoes,"Cadastros registrados pelo pixel") +
    B("Tx. conversão",pct,ca&&ca.txConv,cb&&cb.txConv,"De 100 cliques, quantos viraram cadastro") +
    B("Custo por conversão",brl,ca&&ca.custoConv,cb&&cb.custoConv,"Quanto custou cada cadastro","inv") +
    B("Investimento",brl,ca&&ca.custo,cb&&cb.custo,"Total gasto no grupo","neutro")
  ) : `<div class="vazio">Nenhuma campanha de cadastro rodou nos dois períodos.</div>`;

  const blocosPerfil = (pa||pb) ? blocos(
    B("Alcance",num,pa&&pa.alcance,pb&&pb.alcance,alcExpl(pa,pb)) +
    B("Impressões",num,pa&&pa.impressoes,pb&&pb.impressoes,"Vezes que o anúncio apareceu") +
    B("Frequência",v=>v!=null?nf1.format(v):"—",pa&&pa.frequencia,pb&&pb.frequencia,"Vezes que a mesma pessoa viu","inv") +
    B("CPM",brl,pa&&pa.cpm,pb&&pb.cpm,"Custo para aparecer mil vezes","inv") +
    B("Cliques no link",num,pa&&pa.cliques,pb&&pb.cliques,"Quantas pessoas clicaram") +
    B("CTR",pct,pa&&pa.ctr,pb&&pb.ctr,"De 100 que viram, quantos clicaram") +
    B("Visitas ao perfil",num,pa&&pa.visitasPerfil,pb&&pb.visitasPerfil,"Quantas pessoas foram ao perfil do Instagram") +
    B("Custo por visita",brl,pa&&pa.custoVisita,pb&&pb.custoVisita,"Quanto custou cada visita ao perfil","inv") +
    B("Investimento",brl,pa&&pa.custo,pb&&pb.custo,"Total gasto no grupo","neutro")
  ) : `<div class="vazio">Nenhuma campanha de visita ao perfil rodou nos dois períodos.</div>`;

  /* top 3 de criativos por grupo: no de cadastro, menor custo por conversão;
     no de visita, menor custo por visita. Se o grupo não teve anúncio no período
     atual, mostra os do período de comparação e diz isso no subtítulo. */
  const adsA=D.meta.criativos||[], adsB=D.meta.criativosAnt||[];
  const doGrupo=(l,g)=>l.filter(c=>grupoCampanha(c.objetivo,c.campanha)===g);
  const escolher=g=>{
    const a=doGrupo(adsA,g); if(a.length) return {lista:a,nota:""};
    const b=doGrupo(adsB,g);
    return {lista:b,nota:b.length?` Nenhum anúncio rodou no período atual — estes são os de ${rotuloPer(D.periodo.anterior)}.`:""};
  };
  const top3=(l,g)=>{
    const L=l.map(derivar).filter(c=>c.custo>0);
    const ok=g==="cadastro"?c=>c.conversoes>0:c=>c.visitasPerfil>0;
    const com=L.filter(ok).sort((x,y)=>g==="cadastro"
      ?(x.custoConv-y.custoConv)||(y.conversoes-x.conversoes)
      :(x.custoVisita-y.custoVisita)||(y.visitasPerfil-x.visitasPerfil));
    const sem=L.filter(c=>!ok(c)).sort((x,y)=>(y.ctr||0)-(x.ctr||0));
    return com.concat(sem).slice(0,3);
  };
  const cardTop=(g,tit,sub)=>{
    const {lista,nota}=escolher(g); const L=top3(lista,g);
    const c1=g==="cadastro"?"Conversões":"Visitas ao perfil", c2=g==="cadastro"?"Por conversão":"Por visita";
    const corpo=L.length?`<div class="tw"><table><thead><tr><th>Criativo</th><th>Anúncio</th><th class="r">Investimento</th>
      <th class="r">Impressões</th><th class="r">Cliques</th><th class="r">CTR</th>
      <th class="r">${c1}</th><th class="r">${c2}</th></tr></thead>
      <tbody>${L.map(c=>`<tr>${celCriativo(c)}<td class="nm">${esc(c.nome)}<span>${esc(c.campanha||"")}</span></td>
        <td class="r">${brl(c.custo)}</td><td class="r">${num(c.impressoes)}</td>
        <td class="r">${num(c.cliques)}</td><td class="r">${pct(c.ctr)}</td>
        <td class="r">${num(g==="cadastro"?c.conversoes:c.visitasPerfil)}</td>
        <td class="r">${brl(g==="cadastro"?c.custoConv:c.custoVisita)}</td></tr>`).join("")}</tbody>
      </table></div>`:`<div class="vazio">Nenhum anúncio deste grupo rodou nos dois períodos.</div>`;
    return `<div class="faixa" style="margin-top:14px">${cx(cxt(tit,sub+nota)+corpo)}</div>`;
  };

  return `
  ${titulo("Meta Ads · Campanha de cadastro", semAtual(gc,ca)||"Objetivo de conversão: cadastros no site")}
  ${blocosCadastro}
  ${cardTop("cadastro","Meta Ads · Criativos de conversão · top 3",
            "Os três anúncios de cadastro mais eficientes: menor custo por conversão. Clique na miniatura para abrir o post.")}
  ${titulo("Meta Ads · Campanha de visita ao perfil do Instagram", semAtual(gp,pa)||"Objetivo de tráfego: levar pessoas ao perfil")}
  ${blocosPerfil}
  ${cardTop("perfil","Meta Ads · Criativos de visita ao perfil · top 3",
            "Os três anúncios que mais levaram gente ao perfil pelo menor custo por visita. Clique na miniatura para abrir o post.")}`;
}

/* --------------------------------------------------------------- Instagram */
/* Orgânico, do conector "instagram" do Windsor (Instagram Insights da conta
   comercial). Enquanto a conta não estiver ligada a aba mostra o passo a passo
   da conexão e a prévia dos blocos com travessão — a mesma tela vira painel
   sozinha no primeiro "Puxar dados" depois da ligação. */
const INSTA_CONECTAR="https://onboard.windsor.ai/connect?connector=instagram&client=CLAUDE&next=/instagram/authorize";

function derivarIG(x){
  if(!x) return null;
  return {...x,
    frequencia:  div(x.visualizacoes, x.alcance),
    engajamento: div(x.interacoes, x.alcance)!=null ? div(x.interacoes,x.alcance)*100 : null
  };
}
const tipoIG=p=>{
  const t=(p.tipo||"").toUpperCase(), sf=(p.superficie||"").toUpperCase();
  if(sf==="REELS"||t==="REELS"||t==="REEL") return "Reel";
  if(t==="CAROUSEL_ALBUM") return "Carrossel";
  if(sf==="STORY") return "Story";
  if(t==="VIDEO") return "Vídeo";
  return "Foto";
};
const quandoIG=p=>{
  const d=p.quando?new Date(p.quando):null;
  return (!d||isNaN(d))?"":d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
};
/* a imagem do post vem de domínio externo e o artifact bloqueia — por enquanto
   um quadradinho com o tipo, que abre o post no Instagram. Depois da conexão
   as miniaturas entram embutidas, do mesmo jeito que as do Meta. */
function celPostIG(p){
  const miolo=`<span class="cr-ph ig-ph" aria-hidden="true">${esc(tipoIG(p).toUpperCase())}</span>`;
  return `<td class="cr">${p.post?`<a href="${esc(p.post)}" target="_blank" rel="noopener"
    title="Abrir o post no Instagram">${miolo}</a>`:miolo}</td>`;
}
function cardConexaoIG(motivo){
  const outroErro = motivo && !/instagram account|add your accounts|not connected|não está adicionado/i.test(motivo);
  return cx(cxt("Instagram · aguardando conexão",
    "A aba já está montada. Assim que o perfil entrar no Windsor, o botão <b>Puxar dados</b> preenche tudo isto na mesma consulta dos outros canais — nada mais precisa mudar aqui.",
    "3 passos")
  + `<ol class="pig">
      <li><b>Abrir a conexão no Windsor</b>Entre com a mesma conta Windsor que já serve o painel — a do Google Ads, do Meta e do OpenAI.
        <a class="lk" href="${INSTA_CONECTAR}" target="_blank" rel="noopener">Conectar o Instagram no Windsor →</a></li>

      <li><b>Voltar aqui e clicar em Puxar dados</b>São quatro consultas novas: o perfil dia a dia nas duas janelas, os posts do período e a contagem de seguidores.</li>

function vInstagram(){
  const IG=D.instagram||{};
  const a=derivarIG(IG.atual), b=derivarIG(IG.anterior);
  const pf=IG.perfil||null, posts=IG.posts||[];
  const faltando=!a;   /* sem número no período atual = ainda não conectado */

  const sub = faltando
    ? "Prévia — os números entram na primeira consulta depois da conexão"
    : (pf&&pf.usuario?`Perfil @${esc(pf.usuario)}`:"Perfil conectado no Windsor")
      + (posts.length?` · ${posts.length} ${posts.length===1?"post publicado":"posts publicados"} no período`:"");

  const g1=blocos(
    B1("Seguidores agora",num,pf&&pf.seguidores,
      "Total de seguidores no momento da consulta. O Instagram não devolve histórico de seguidores — por isso este número não acompanha o período escolhido.","Agora") +
    B("Alcance",num,a&&a.alcance,b&&b.alcance,
      "Alcance da conta somado dia a dia: quem viu em dois dias conta duas vezes — o Instagram não entrega alcance fechado de período. Nos dias de campanha ele sobe muito acima do alcance dos posts, então leia como alcance da conta, não só do orgânico.") +
    B("Visualizações",num,a&&a.visualizacoes,b&&b.visualizacoes,
      "Vezes que o conteúdo apareceu. É a métrica que substituiu as impressões no Instagram.") +
    B("Frequência",v=>v!=null?nf1.format(v):"—",a&&a.frequencia,b&&b.frequencia,
      "Vezes que a mesma pessoa viu o conteúdo","inv") +
    B("Novos seguidores",num,a&&a.novosSeguidores,b&&b.novosSeguidores,
      IG.erroSeguidores
        ? "O Instagram só entrega novos seguidores dos últimos 30 dias — para uma janela mais antiga que isso o número não existe."
        : "Contas que passaram a seguir o perfil dentro do período") +
    B("Contas que interagiram",num,a&&a.contasEngajadas,b&&b.contasEngajadas,
      "Contas diferentes que curtiram, comentaram, salvaram ou compartilharam — também somadas por dia") +
    B("Toques nos links do perfil",num,a&&a.toquesLinks,b&&b.toquesLinks,
      "Cliques no site, no e-mail ou no telefone que ficam na bio")
  );

  const g2=blocos(
    B("Interações totais",num,a&&a.interacoes,b&&b.interacoes,
      "Curtidas, comentários, salvamentos e compartilhamentos somados") +
    B("Taxa de engajamento",pct,a&&a.engajamento,b&&b.engajamento,
      "Interações divididas pelo alcance. Como o alcance soma os dias e conta os dias de campanha, a taxa sai baixa: serve para comparar um período com o outro, não como número absoluto") +
    B("Curtidas",num,a&&a.curtidas,b&&b.curtidas,"Curtidas em posts, reels e vídeos") +
    B("Comentários",num,a&&a.comentarios,b&&b.comentarios,"Comentários deixados no conteúdo") +
    B("Salvamentos",num,a&&a.salvamentos,b&&b.salvamentos,
      "Guardaram o post para ver depois — o sinal mais forte de interesse. O Instagram desconta quem tirou o salvamento, então num período de poucas ações o saldo pode ficar negativo.") +
    B("Compartilhamentos",num,a&&a.compartilhamentos,b&&b.compartilhamentos,
      "Mandaram para alguém ou repostaram no story")
  );

  const L=posts.slice(0,5);
  const tabela = L.length
    ? `<div class="tw"><table><thead><tr><th>Post</th><th>Tipo</th>
        <th class="r">Alcance</th><th class="r">Visualizações</th><th class="r">Interações</th>
        <th class="r">Salvos</th><th class="r">Seguiu depois</th></tr></thead>
       <tbody>${L.map(p=>`<tr>${celPostIG(p)}<td class="nm">${esc(tipoIG(p))}<span>${esc(quandoIG(p))}</span></td>
        <td class="r">${num(p.alcance)}</td><td class="r">${num(p.visualizacoes)}</td>
        <td class="r">${num(p.interacoes)}</td><td class="r">${num(p.salvamentos)}</td>
        <td class="r">${num(p.seguidores)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="vazio">${faltando
        ? "Os posts do período entram aqui na primeira consulta depois da conexão."
        : "Nenhum post publicado no período."}</div>`;

  return `
  ${faltando?cardConexaoIG(IG.erro):""}
  ${tituloGrupo("Instagram · Alcance e audiência",sub)}
  ${g1}
  ${tituloGrupo("Instagram · Interações","O que as pessoas fizeram com o conteúdo publicado")}
  ${g2}
  <div class="faixa" style="margin-top:14px">${cx(cxt("Instagram · Posts do período · top 5",
      "Entram os posts <b>publicados</b> na janela escolhida, mas os números de cada um são o total "+
      "acumulado até agora, não só o do período: o Instagram não recorta métrica de post por data. "+
      "Clique no quadradinho para abrir o post. Em <b>Seguiu depois</b> o travessão é dos reels — "+
      "o Instagram não mede seguidor ganho neles.")+tabela)}</div>`;
}

function vOpenai(){

     conversão do canal. Os rótulos das colunas são os do export, não os da
     barra, porque a janela do arquivo é que manda aqui. */
  const M=(typeof OPENAI_MANAGER!=="undefined")?OPENAI_MANAGER:null;
  if(!M||!M.atual) return `<div class="vazio">Sem export do Ads Manager carregado para este canal.</div>`;
  const totalDe=l=>derivar(l.reduce((x,c)=>({impressoes:x.impressoes+c.impressoes,

    {impressoes:0,cliques:0,conversoes:0,custo:0}));
  const a=totalDe(M.atual.campanhas), z=M.anterior?totalDe(M.anterior.campanhas):null;
  const rot=z?{a:M.atual.rotulo,b:M.anterior.rotulo}:null;
  const bl=(r,f,k,e,m)=>B(r,f,a[k],z&&z[k],e,m,rot);
  return `
  ${tituloGrupo("OpenAI Ads · semana a semana (export do Ads Manager)",
      "Conferido contra o Windsor em 15/09: impressões e cliques batem exatamente, o gasto difere um centavo por campanha (arredondamento do export). Só as conversões são informação nova.")}
  ${blocos(
    bl("Conversões",num,"conversoes","Cadastros registrados pelo Ads Manager") +
    bl("Custo por conversão",brl,"custoConv","Quanto custou cada cadastro","inv") +
    bl("Tx. conversão",pct,"txConv","De 100 cliques, quantos viraram cadastro") +
    bl("Investimento",brl,"custo","Total gasto no canal","neutro") +
    bl("Impressões",num,"impressoes","Vezes que o anúncio apareceu") +
    bl("Cliques",num,"cliques","Quantas pessoas clicaram") +
    bl("CTR",pct,"ctr","De 100 que viram, quantos clicaram") +
    bl("CPC",brl,"cpc","Quanto custou cada clique","inv") +
    bl("CPM",brl,"cpm","Custo para aparecer mil vezes","inv")

  <p class="proc">O export novo não traz mais a coluna de páginas vistas, então
  os blocos "Páginas vistas" e "Chegaram na página" saíram desta janela.</p>`;

/* ------------------------------------------------------------ Landing Page */
function vLP(){
  /* oito blocos do Clarity, semana contra semana, mais de onde vieram as
     visitas. Nada de GA4. Os rótulos são os do export: a janela do arquivo
     não é exatamente a da barra, e mentir sobre isso seria pior. */
  const K=(typeof CLARITY_SEMANAS!=="undefined")?CLARITY_SEMANAS:null;
  if(!K||!K.atual) return `<div class="vazio">Sem export do Clarity carregado.</div>`;
  const A=K.atual, Z=K.anterior||null;
  const rot=Z?{a:A.rotulo,b:Z.rotulo}:null;
  const g=(x,f)=>x?f(x):null;
  const bl=(r,fm,f,e,m)=>B(r,fm,g(A,f),g(Z,f),e,m,rot);
  const novos=x=>x.sessoes?x.sessoesNovos/x.sessoes*100:null;
  const vel=v=>v!=null?nf0.format(v)+"/100":"—";

  /* as duas janelas têm tamanhos diferentes: o export novo do Clarity começou
     em 07/09 e não em 08/09. Dizer isso é mais útil que esconder. */
  const aviso=(Z&&A.dias!==Z.dias)?`<p class="aviso"><b>As duas janelas não têm o mesmo tamanho.</b>
    O export novo do Clarity veio de ${esc(A.rotulo)} — ${A.dias} dias, não 7 — e o dia 07/09
    aparece nos dois arquivos. Por isso a variação de visitas está inflada: por dia são
    <b>${nf0.format(A.sessoes/A.dias)}</b> contra <b>${nf0.format(Z.sessoes/Z.dias)}</b>.
    As médias (rolagem, tempo, percentuais) não sofrem com isso. Reexportando 08–14/09 eu troco em minutos.</p>`:"";

  const antes={}; (Z&&Z.origens||[]).forEach(o=>{antes[o.n]=o.s});
  const origens=A.origens||[];
  const maxO=Math.max(1,...origens.map(o=>o.s));
  const totO=origens.reduce((x,o)=>x+o.s,0);

  return `
  ${tituloGrupo("Landing Page · semana a semana (Microsoft Clarity)",
      "Export do painel do Clarity — a API só devolve os últimos 3 dias, então estas datas não vêm ao vivo")}
  ${aviso}
  ${blocos(
    bl("Visitas",num,x=>x.sessoes,"Vezes que alguém abriu a página") +
    bl("Visitantes novos",pct,novos,"Das visitas, quantas eram de quem nunca tinha entrado","neutro") +
    bl("Rolagem média",pct,x=>x.scroll,"Até onde descem na página: 16% é só a primeira tela") +
    bl("Tempo ativo",seg,x=>x.tempoAtivo,"Tempo realmente mexendo na página") +
    bl("Cliques de saída",pct,x=>x.cliqueSaidaPct,"Visitas com clique que leva para fora da página (ex.: abrir o app)","neutro") +
    bl("Cliques em “Entrar”",pct,x=>x.cliqueLoginPct,"Visitas que clicaram para fazer login") +
    bl("No celular",pct,x=>x.mobilePct,"Soma dos navegadores de celular dividida pelas visitas — este export não traz o corte por dispositivo","neutro") +
    bl("Velocidade",vel,x=>x.desempenho.pontuacao,
       `Nota do Clarity. O conteúdo principal aparece em ${nf2.format(A.desempenho.lcpSeg)}s (o ideal é até 2,5s)`)
  )}
  <div class="faixa" style="margin-top:14px">
    ${cx(cxt("De onde vieram as visitas",
        "Por onde a pessoa chegou até a página em "+esc(A.rotulo)+", com o número da semana anterior ao lado.")
      + origens.map(o=>`<div class="linha larga"><span class="lo"><b>${esc(o.n)}</b><small>${esc(o.d||"")}</small></span>
        <span class="lt"><span class="lf" style="width:${(o.s/maxO*100).toFixed(1)}%;background:var(--d1)"></span></span>
        <span class="lv">${num(o.s)}<small>${totO?nf0.format(o.s/totO*100):"—"}% · antes ${antes[o.n]!=null?num(antes[o.n]):"—"}</small></span></div>`).join("")
      + `<p class="proc">Visitas que chegaram digitando o endereço ou por link sem identificação não aparecem aqui — por isso a soma é menor que o total de visitas. Os acessos do Lovable (a ferramenta em que a página foi construída) foram tirados: não são visitantes.</p>`)}
  </div>`;
}

/* ------------------------------------------------------------ Visão geral */
function vVisao(){
  /* comparação de canais: um cartão por canal (logo, investimento, fatia e os
     três números que importam), barras empilhadas de participação por métrica
     e a tabela completa com o melhor valor de cada coluna destacado */
  const V=(typeof VISAO_SEMANA!=="undefined")?VISAO_SEMANA:null;
  if(!V) return `<div class="vazio">Sem consolidado da semana.</div>`;
  const rp=V.rotulo;
  const COR={"Google Ads":"var(--d1)","Meta Ads":"var(--d2)","OpenAI Ads":"var(--d3)"};
  const LOGO={"Google Ads":IC.gads,"Meta Ads":IC.metaf,"OpenAI Ads":IC.oai};
  const C=V.canais.map(c=>({...derivar(c),custoCad:c.cadastros?c.custo/c.cadastros:null}));
  const T=derivar(C.reduce((a,c)=>({impressoes:a.impressoes+c.impressoes,cliques:a.cliques+c.cliques,
    custo:a.custo+c.custo,conversoes:a.conversoes+(c.cadastros||0)}),{impressoes:0,cliques:0,custo:0,conversoes:0}));
  const alcance=C.reduce((a,c)=>a+(c.alcance||0),0);
  const fatia=(v,t)=>t?v/t*100:0;
  const logo=n=>`<span class="clogo"><svg viewBox="0 0 24 24" class="marca" aria-hidden="true">${LOGO[n]||""}</svg></span>`;

  const cartoes=`<div class="canais">${C.map(c=>`
    <article class="canal" style="--c:${COR[c.n]}">
      <header>${logo(c.n)}<div><b>${esc(c.n)}</b><small>${esc(c.fonte)}</small></div></header>
      <div class="cinv"><span class="k">Investimento em ${rp.toLowerCase()}</span>
        <span class="v">${brl(c.custo)}</span>
        <span class="fx"><i style="width:${fatia(c.custo,T.custo).toFixed(1)}%"></i></span>
        <span class="k2">${nf0.format(fatia(c.custo,T.custo))}% de tudo o que foi investido</span></div>
    </article>`).join("")}</div>`;

  const metricas=[
    ["Investimento", c=>c.custo,        T.custo,        brl],
    ["Impressões",   c=>c.impressoes,   T.impressoes,   num],
    ["Cliques",      c=>c.cliques,      T.cliques,      num],
    ["Cadastros",    c=>c.cadastros||0, T.conversoes,   num]
  ];
  const empilhado=metricas.map(([rot,f,tot,fmt])=>`
    <div class="emp"><span class="emp-r">${rot}</span>
      <span class="emp-b">${C.map(c=>{const p=fatia(f(c),tot);
        return `<i style="width:${p.toFixed(2)}%;background:${COR[c.n]}" title="${esc(c.n)}: ${fmt(f(c))} (${nf0.format(p)}%)">${p>=11?`<em>${nf0.format(p)}%</em>`:""}</i>`}).join("")}</span>
      <span class="emp-t">${fmt(tot)}</span></div>`).join("");
  const legenda=`<div class="legenda">${C.map(c=>`<span><i style="background:${COR[c.n]}"></i>${esc(c.n)}</span>`).join("")}</div>`;

  /* a tabela "Todos os números" saiu a pedido — as três camadas viraram duas */

  /* bloco de acumulado, acima dos cartões por canal. Sai do MESMO T que
     alimenta as barras, então os dois nunca podem discordar: T.conversoes é a
     soma dos cadastros dos canais e T.custoConv já é o custo dividido por ela. */
  const porCanal=C.map(c=>`${esc(c.n.replace(" Ads",""))} ${num(c.cadastros)}`).join(" · ");
  const acumulado=`
    ${tituloGrupo("Conversões · "+rp,"Os três canais de anúncio somados no período inteiro")}
    ${blocos(
      B1("Conversões",num,T.conversoes,
        `Soma do que cada plataforma se atribui — ${porCanal}. Quem passou por dois canais antes de se cadastrar pode estar contado duas vezes.`,
        rp) +
      B1("Custo médio por cadastro",brl,T.custoConv,
        `Tudo o que foi investido nos três canais (${brl(T.custo)}) dividido pelas conversões`,
        rp)
    )}`;

  return `
  ${acumulado}
  ${tituloGrupo("Por canal · "+rp)}
  ${cartoes}
  <div class="faixa" style="margin-top:14px">${cx(cxt("Onde foi o dinheiro e de onde vieram os cadastros",
      "Cada barra soma 100%. Compare a fatia de investimento de um canal com a fatia de cadastros que ele trouxe.")
      + legenda + empilhado)}</div>`;
}

function abrir(id){
  ABAS.forEach(v=>{
    const on=v.id===id;
    document.getElementById("it-"+v.id).setAttribute("aria-selected",on?"true":"false");
    document.getElementById("v-"+v.id).hidden=!on;
  });
  main.scrollTop=0;
  try{localStorage.setItem("mia:vista",id)}catch(e){}
}

const elEstado=document.getElementById("estado"), elEd=document.getElementById("edicao");
const btPer=document.getElementById("btPer"), btComp=document.getElementById("btComp");
const elLig=document.getElementById("lig"), cdComp=document.getElementById("cdComp");
const cbComp=document.getElementById("cbComp"), btAbrir=document.getElementById("btAbrir");
/* os tres controles que abrem a edicao compartilham o aria-expanded */
const ABRIDORES=[btPer,btComp,btAbrir];
const MES_LONGO=iso=>new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"});
const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
/* o período escrito como se fala: mês fechado vira "Agosto de 2026"; intervalo
   vira "24 a 30 de agosto" ou "28 de julho a 3 de agosto", com o ano só quando
   não é o corrente */
const dataOk=iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso||"")&&!isNaN(new Date(iso+"T12:00:00"));
/* minusc=true escreve o mês em minúscula, para a comparação ler como parte da frase */
function rotuloLongo(de,ate,minusc){
  if(!dataOk(de)||!dataOk(ate)||de>ate) return "Escolha as datas";
  const M=minusc?MES_LONGO(de):cap(MES_LONGO(de));
  if(ehMesCalendario(de,ate)) return `${M} de ${de.slice(0,4)}`;
  const [ya,ma,da]=de.split("-"), [yb,mb,db]=ate.split("-");
  const agora=String(new Date().getFullYear());
  const anoA=ya!==agora?` de ${ya}`:"", anoB=yb!==agora?` de ${yb}`:"";
  if(de===ate) return `${+da} de ${MES_LONGO(de)}${anoA}`;
  if(ya===yb&&ma===mb) return `${+da} a ${+db} de ${MES_LONGO(de)}${anoA}`;
  return `${+da} de ${MES_LONGO(de)}${ya!==yb?` de ${ya}`:""} a ${+db} de ${MES_LONGO(ate)}${anoB}`;
}
function pintarEstado(){
  /* a frase-título descreve a SELEÇÃO (o que o botão vai puxar); a linha de
     estado diz se a tela já corresponde a ela e de onde vieram os dados */
  const de=inDe.value, ate=inAte.value, cde=inCDe.value, cate=inCAte.value;
  btPer.textContent=rotuloLongo(de,ate); btComp.textContent=rotuloLongo(cde,cate,true);
  /* sem comparação a barra é uma frase de um período só: o "comparado com" e a
     segunda data saem da tela, e o campo de comparação sai da edição */
  elLig.hidden=!comparar; btComp.hidden=!comparar;
  cdComp.hidden=!comparar; cbComp.checked=comparar;
  const dias=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000)+1;
  let cls="", html="";
  const campos=comparar?[inDe,inAte,inCDe,inCAte]:[inDe,inAte];
  const ok=campos.every(e=>dataOk(e.value)&&e.validity.valid)&&de<=ate&&(!comparar||cde<=cate);
  if(!ok){
    cls="mal"; html="<b>Datas incompletas.</b> O início de cada período precisa vir antes do fim.";
  } else {
    const pa=D.periodo.anterior;
    const naTela = D.periodo.atual.de===de && D.periodo.atual.ate===ate &&
      (comparar ? (!!pa && pa.de===cde && pa.ate===cate) : !pa);
    const d1=dias(de,ate);
    let tam, desiguais=false;
    if(!comparar){
      tam = ehMesCalendario(de,ate) ? "Um mês fechado, sem comparação."
          : `${d1} ${d1===1?"dia":"dias"}, sem comparação.`;
    } else {
      const d2=dias(cde,cate);
      const doisMeses=ehMesCalendario(de,ate)&&ehMesCalendario(cde,cate);
      desiguais=!doisMeses&&d1!==d2;
      tam = doisMeses ? "Dois meses fechados."
          : d1===d2 ? `${d1} dias em cada período.`
          : `Atenção: períodos de tamanhos diferentes, ${d1} e ${d2} dias.`;
    }
    if(!elEd.hidden){
      html=`Ajuste as datas e clique em Aplicar datas. ${esc(tam)}`; cls=desiguais?"mal":"";
    } else if(!naTela){
      cls=desiguais?"mal":"novo";
      html=`<b>Datas novas.</b> Clique em Puxar dados para atualizar o painel. ${esc(tam)}`;
    } else if(D.aoVivo&&D.falhouTudo){
      cls="mal"; html="<b>A consulta não trouxe dados de nenhuma fonte.</b> Veja o aviso em cada aba e tente de novo.";
    } else {
      const fonte = D.aoVivo
        ? (D.restaurado ? `${cap(D.puxadoEm)} e salvo neste navegador.` : `Dados ao vivo (${D.puxadoEm}).`)
        : `Retrato gravado em ${D.puxadoEm.replace(" (gravado)","")}.`;
      cls = desiguais ? "mal" : (D.aoVivo&&!D.restaurado ? "vivo" : "");
      html=`${esc(fonte)} ${esc(tam)}`;
    }
  }
  if(MCP===null) html+=` <small>A consulta ao vivo só funciona com o painel aberto dentro do claude.ai.</small>`;
  elEstado.className="estado-l"+(cls?" "+cls:"");
  elEstado.querySelector("span").innerHTML=html;
  btPuxar.disabled=(MCP===null);
  if(MCP===null) btPuxar.title="Abra o painel dentro do claude.ai para consultar ao vivo.";
}

/* modo de edição das datas */
let antesEd=null;
function abrirEdicao(foco){
  antesEd=[inDe.value,inAte.value,inCDe.value,inCAte.value];
  elEd.hidden=false; ABRIDORES.forEach(b=>b.setAttribute("aria-expanded","true"));
  pintarEstado(); (foco||inDe).focus();
}
/* Aplicar só fecha com as quatro datas válidas e aí grava na memória;
   Cancelar/Esc devolvem as datas de antes de abrir. Enter num campo aplica;
   os atalhos também fecham a edição. */
function fecharEdicao(cancelar){
  if(!cancelar){
    const usados=comparar?[inDe,inAte,inCDe,inCAte]:[inDe,inAte];
    const validas=usados.every(e=>dataOk(e.value)&&e.validity.valid)
      &&inDe.value<=inAte.value&&(!comparar||inCDe.value<=inCAte.value);
    if(!validas){ pintarEstado(); return; }   /* fica aberto mostrando "Datas incompletas" */
  }
  if(cancelar&&antesEd){ [inDe.value,inAte.value,inCDe.value,inCAte.value]=antesEd; }
  antesEd=null; elEd.hidden=true; ABRIDORES.forEach(b=>b.setAttribute("aria-expanded","false"));
  lembrarDatas(); pintarEstado();
}
btPer.addEventListener("click",()=>elEd.hidden?abrirEdicao(inDe):fecharEdicao(false));
btComp.addEventListener("click",()=>elEd.hidden?abrirEdicao(inCDe):fecharEdicao(false));
btAbrir.addEventListener("click",()=>elEd.hidden?abrirEdicao(inDe):fecharEdicao(false));
cbComp.addEventListener("change",()=>{
  comparar=cbComp.checked;
  /* religar sempre reencaixa a janela anterior de mesmo tamanho: enquanto a
     comparação estava desligada o período pode ter mudado, e manter a janela
     velha compararia com um intervalo sem relação nenhuma. A edição está
     aberta, então dá para ajustar em seguida. */
  if(comparar) encaixar();
  lembrarDatas(); pintarEstado();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!elEd.hidden&&!elEd.contains(e.target)){fecharEdicao(true);btPer.focus();}
});
document.getElementById("btAplicar").addEventListener("click",()=>{fecharEdicao(false);btPer.focus();});
document.getElementById("btCancelar").addEventListener("click",()=>{fecharEdicao(true);btPer.focus();});
elEd.addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.preventDefault();fecharEdicao(true);btPer.focus();}
  if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();fecharEdicao(false);btPer.focus();}
});

function desenhar(){
  ABAS.forEach(v=>{document.getElementById("v-"+v.id).innerHTML=v.r()});
  pintarEstado();
  const t=document.getElementById("obs");
  if(t){
    try{t.value=localStorage.getItem("mia:obs")||""}catch(e){}
    t.addEventListener("input",()=>{try{localStorage.setItem("mia:obs",t.value)}catch(e){}});
  }
}

const inDe=document.getElementById("de"), inAte=document.getElementById("ate");
const inCDe=document.getElementById("cde"), inCAte=document.getElementById("cate");
const btPuxar=document.getElementById("btPuxar"), txPuxar=document.getElementById("txPuxar");
const menos=(iso,d)=>{const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()-d);
  return x.toISOString().slice(0,10)};
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* um período é um mês-calendário quando vai do dia 1 ao último dia do mesmo mês */
function ehMesCalendario(de,ate){
  if(!de||!ate) return false;
  const a=new Date(de+"T12:00:00"), b=new Date(ate+"T12:00:00");
  if(a.getDate()!==1) return false;
  if(a.getFullYear()!==b.getFullYear()||a.getMonth()!==b.getMonth()) return false;
  const ultimo=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
  return b.getDate()===ultimo;
}

function preencher(de,ate,cde,cate,cmp){
  inDe.value=isoLocal(de); inAte.value=isoLocal(ate);
  inCDe.value=isoLocal(cde); inCAte.value=isoLocal(cate);
  if(cmp!==undefined) comparar=cmp;   /* os atalhos são todos comparativos */
  if(!elEd.hidden) fecharEdicao(false);
  lembrarDatas(); pintarEstado();
}
function atalhoSemana(){
  const hoje=new Date(); const dow=(hoje.getDay()+6)%7;      /* 0 = segunda */
  const fim=new Date(hoje); fim.setDate(hoje.getDate()-dow-1); /* domingo passado */
  const ini=new Date(fim);  ini.setDate(fim.getDate()-6);
  const fimB=new Date(ini); fimB.setDate(ini.getDate()-1);
  const iniB=new Date(fimB); iniB.setDate(fimB.getDate()-6);
  preencher(ini,fim,iniB,fimB,true);
}
function atalhoMes(){
  const hoje=new Date();
  const fim=new Date(hoje.getFullYear(),hoje.getMonth(),0);     /* último dia do mês passado */
  const ini=new Date(fim.getFullYear(),fim.getMonth(),1);
  const fimB=new Date(ini.getFullYear(),ini.getMonth(),0);
  const iniB=new Date(fimB.getFullYear(),fimB.getMonth(),1);
  preencher(ini,fim,iniB,fimB,true);
}
/* "Este mês": do dia 1 até ONTEM, contra o mesmo trecho do mês passado. Comparar
   um mês correndo com um mês fechado inteiro daria uma queda que não existe. */
function atalhoMesAtual(){
  const h=new Date();
  /* meia-noite local nos dois: com new Date(hoje) a hora do dia entrava na
     conta de dias e a janela de comparacao saia um dia maior */
  const fim=new Date(h.getFullYear(),h.getMonth(),h.getDate()-1);
  const ini=new Date(fim.getFullYear(),fim.getMonth(),1);
  const n=Math.round((fim-ini)/86400000);
  const iniB=new Date(ini.getFullYear(),ini.getMonth()-1,1);
  const fimB=new Date(iniB); fimB.setDate(iniB.getDate()+n);
  preencher(ini,fim,iniB,fimB,true);
}
function encaixar(){
  if(!comparar) return;
  const de=inDe.value,ate=inAte.value; if(!dataOk(de)||!dataOk(ate)||de>ate)return;
  const n=Math.round((new Date(ate)-new Date(de))/86400000); if(!Number.isFinite(n))return;
  inCAte.value=menos(de,1); inCDe.value=menos(inCAte.value,n);
}
/* memória do painel: as quatro datas e o último resultado de "Puxar dados"
   ficam guardados no navegador, para não sumirem quando a página é atualizada
   (inclusive quando uma versão nova do painel é publicada). */
const VERSAO_DADOS="2026-09-15-semanal";  /* mude quando o formato de D mudar: o
   resultado salvo é descartado com segurança; as datas ficam sempre */
function lembrarDatas(){
  try{localStorage.setItem("mia:datas",JSON.stringify(
    {de:inDe.value,ate:inAte.value,cde:inCDe.value,cate:inCAte.value,cmp:comparar,
     carimbo:RETRATO.carimbo}))}catch(e){}
}
function guardarVivo(d){
  try{localStorage.setItem("mia:vivo",JSON.stringify({v:VERSAO_DADOS,d}))}catch(e){}
}
function restaurar(){
  try{
    const s=JSON.parse(localStorage.getItem("mia:vivo")||"null");
    if(s&&s.v===VERSAO_DADOS&&s.d&&s.d.periodo&&s.d.periodo.atual){ D=s.d; D.restaurado=true; }
  }catch(e){}
  try{
    const dt=JSON.parse(localStorage.getItem("mia:datas")||"null");
    /* datas salvas de um retrato anterior não mandam no retrato novo: quando o
       carimbo muda, o painel adota UMA vez o período gravado. Depois disso o
       que você escolher volta a valer, como sempre. */
    const mesmoRetrato = dt && dt.carimbo===RETRATO.carimbo;
    if(dt&&mesmoRetrato&&[dt.de,dt.ate,dt.cde,dt.cate].every(dataOk)){
      inDe.value=dt.de; inAte.value=dt.ate; inCDe.value=dt.cde; inCAte.value=dt.cate;
      if(typeof dt.cmp==="boolean") comparar=dt.cmp;
    } else if(dt&&!mesmoRetrato){
      comparar=!!RETRATO.periodo.anterior;   /* os campos já vêm do RETRATO */
      lembrarDatas();
    } else if(D.aoVivo){
      inDe.value=D.periodo.atual.de; inAte.value=D.periodo.atual.ate;
      if(D.periodo.anterior){
        inCDe.value=D.periodo.anterior.de; inCAte.value=D.periodo.anterior.ate;
      }
      comparar=!!D.periodo.anterior;
    }
  }catch(e){}
}

inDe.value=RETRATO.periodo.atual.de;   inAte.value=RETRATO.periodo.atual.ate;
inCDe.value=RETRATO.periodo.anterior.de; inCAte.value=RETRATO.periodo.anterior.ate;
restaurar();
[inDe,inAte].forEach(e=>e.addEventListener("change",()=>{encaixar();pintarEstado()}));
[inCDe,inCAte].forEach(e=>e.addEventListener("change",pintarEstado));
btPuxar.addEventListener("click",puxar);
document.getElementById("btSemana").addEventListener("click",atalhoSemana);
document.getElementById("btMes").addEventListener("click",atalhoMes);
document.getElementById("btMesAtual").addEventListener("click",atalhoMesAtual);

const SOL='<circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>';
const LUA='<path d="M20 14.5A8.4 8.4 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>';
const icTema=document.getElementById("icTema");
function tema(t){
  if(t)document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const e2=t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches);
  icTema.innerHTML=e2?SOL:LUA;
  try{t?localStorage.setItem("mia:tema",t):localStorage.removeItem("mia:tema")}catch(e){}
}
document.getElementById("btTema").addEventListener("click",()=>{
  const at=document.documentElement.getAttribute("data-theme");
  const es=at==="dark"||(!at&&matchMedia("(prefers-color-scheme:dark)").matches);
  tema(es?"light":"dark");
});

desenhar();
try{
  const s=localStorage.getItem("mia:vista");
  if(s&&ABAS.some(v=>v.id===s)) abrir(s);
  tema(localStorage.getItem("mia:tema"));
}catch(e){tema(null)}
</script>
