<title>Painel Semanal Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --menta:#D8ECE3; --casca:#FFF; --tela:#F5F8F6; --cartao:#FFF;
  --mata:#2D6A4F; --borda:#E7EDEA; --borda-2:#EFF3F1;
  --texto:#182821; --texto-2:#56695F; --texto-3:#8B9C93; --trilho:#EAEFEC;
  --d1:#0E8F63; --d2:#D07C1A; --d3:#8C4FBF;
  --bom:#0E7A55; --ruim:#BC4033; --bom-t:#E2F2EB; --ruim-t:#FBE9E6;
  --av:#8A5A08; --av-t:#FBF1DE;
  --sombra:0 1px 2px rgba(24,40,33,.04), 0 8px 24px -8px rgba(24,40,33,.10);
  --menu:rgba(255,255,255,.62); --menu-bg:rgba(255,255,255,.13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --menta:#080F0D; --casca:#101B17; --tela:#0C1613; --cartao:#15211D;
  --mata:#1A3E2F; --borda:#243530; --borda-2:#1C2A25;
  --texto:#E6EFE9; --texto-2:#A6BAAF; --texto-3:#788C83; --trilho:#21302B;
  --d1:#14A070; --d2:#C67B22; --d3:#8E72D0;
  --bom:#3EBE8B; --ruim:#E58579; --bom-t:#0E2A20; --ruim-t:#2E1A17;
  --av:#E0AE55; --av-t:#2E2413;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --menu:rgba(230,239,233,.6); --menu-bg:rgba(255,255,255,.09);
}}
:root[data-theme="dark"]{
  --menta:#080F0D; --casca:#101B17; --tela:#0C1613; --cartao:#15211D;
  --mata:#1A3E2F; --borda:#243530; --borda-2:#1C2A25;
  --texto:#E6EFE9; --texto-2:#A6BAAF; --texto-3:#788C83; --trilho:#21302B;
  --d1:#14A070; --d2:#C67B22; --d3:#8E72D0;
  --bom:#3EBE8B; --ruim:#E58579; --bom-t:#0E2A20; --ruim-t:#2E1A17;
  --av:#E0AE55; --av-t:#2E2413;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --menu:rgba(230,239,233,.6); --menu-bg:rgba(255,255,255,.09);
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--menta);color:var(--texto);margin:0;padding:20px;overflow:hidden;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
@supports (height:100dvh){html,body{height:100dvh}}
.rola{scrollbar-width:thin;scrollbar-color:var(--trilho) transparent}
.rola::-webkit-scrollbar{width:10px;height:10px}
.rola::-webkit-scrollbar-track{background:transparent}
.rola::-webkit-scrollbar-thumb{background:var(--trilho);border-radius:99px;
  border:3px solid transparent;background-clip:content-box}

.app{max-width:1240px;height:100%;margin:0 auto;background:var(--casca);border-radius:26px;
  box-shadow:0 2px 6px rgba(24,40,33,.05),0 24px 60px -20px rgba(24,40,33,.18);
  display:grid;grid-template-columns:214px minmax(0,1fr);overflow:hidden}

.lado{background:var(--mata);padding:24px 14px 18px;display:flex;flex-direction:column;
  gap:24px;overflow-y:auto;min-height:0}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.logo .b{width:31px;height:31px;border-radius:10px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;flex:none}
.logo b{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:16px;line-height:1.1}
.logo small{display:block;font-size:10px;font-weight:500;color:var(--menu);margin-top:1px}
.menu{display:flex;flex-direction:column;gap:3px;flex:1}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;
  border:none;background:none;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;
  font-size:13.5px;font-weight:600;color:var(--menu);text-align:left;position:relative}
.item svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
/* logos oficiais dos canais: preenchidos, sem o traço herdado dos ícones genéricos */
.item svg.marca{stroke:none;stroke-width:0;fill:currentColor}
.item:hover,.item[aria-selected="true"]{background:var(--menu-bg);color:#fff}
.item .pt{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0}
.item[aria-selected="true"] .pt{opacity:1}
.item:focus-visible{outline:2px solid #fff;outline-offset:1px}
.imp{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;
  border:none;background:#fff;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;
  font-size:12.5px;font-weight:700;color:var(--mata)}
.imp svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}

.tela{background:var(--tela);display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-width:0;overflow:hidden}

/* ---------------- barra de consulta: é o coração do painel ---------------- */
.consulta{background:var(--cartao);border-bottom:1px solid var(--borda);
  padding:16px 22px 13px;display:flex;flex-direction:column;gap:12px}
.c-linha{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}

/* par de datas como um campo só, com o rótulo dentro */
.cd{display:flex;flex-direction:column;justify-content:center;gap:3px;
  background:var(--tela);border:1px solid var(--borda);border-radius:13px;
  padding:8px 15px;transition:border-color .15s}
.cd:hover{border-color:var(--texto-3)}
.cd:focus-within{border-color:var(--mata);box-shadow:0 0 0 3px
  color-mix(in srgb, var(--mata) 14%, transparent)}
.cd-l{font-family:"Plus Jakarta Sans",sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--texto-3);line-height:1}
.cd-v{display:flex;align-items:center;gap:7px}
.cd input[type=date]{font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;border:none;background:none;padding:0;margin:0;
  color:var(--texto);letter-spacing:-.01em;width:8.6em}
.cd input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
.cd input[type=date]:focus-visible{outline:none}
.cd-seta{color:var(--texto-3);font-size:12px}
.c-vs{align-self:center;font-family:"Plus Jakarta Sans",sans-serif;font-size:10.5px;
  font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--texto-3);
  padding:0 2px}

/* atalhos como controle segmentado */
.seg{display:flex;align-self:stretch;border:1px solid var(--borda);border-radius:13px;
  overflow:hidden;background:var(--tela)}
.seg button{font-family:"Plus Jakarta Sans",sans-serif;font-size:11.5px;font-weight:700;
  padding:0 15px;border:none;background:none;color:var(--texto-2);cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
.seg button + button{border-left:1px solid var(--borda)}
.seg button:hover{background:var(--cartao);color:var(--texto)}
.seg button:focus-visible{outline:2px solid var(--mata);outline-offset:-3px}
.puxar{font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:10px;border:none;background:var(--mata);color:#fff;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.puxar:hover{filter:brightness(1.1)}
.puxar:disabled{opacity:.6;cursor:default}
.puxar:focus-visible{outline:2px solid var(--mata);outline-offset:2px}
.puxar .gira{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite;display:none}
.puxar.indo .gira{display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.ferram{display:flex;gap:8px;margin-left:auto;align-items:center}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--borda);background:var(--cartao);
  cursor:pointer;display:grid;place-items:center;color:var(--texto-2)}
.ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;
  stroke-linejoin:round}
.ic:focus-visible{outline:2px solid var(--mata);outline-offset:1px}
.eu{width:36px;height:36px;border-radius:50%;background:var(--mata);color:#fff;display:grid;
  place-items:center;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:12px}
/* estado em chips: cada fato num selo, nada de frase corrida */
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"Plus Jakarta Sans",sans-serif;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:5px 11px;border-radius:99px;
  background:var(--tela);border:1px solid var(--borda-2);color:var(--texto-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;flex:none}
.chip.vivo{background:var(--bom-t);border-color:transparent;color:var(--bom)}
.chip.vivo i{background:var(--bom)}
.chip.foto i{background:var(--texto-3)}
.chip.acao{background:var(--mata);border-color:transparent;color:#fff}
.chip.mal{background:var(--ruim-t);border-color:transparent;color:var(--ruim)}
.chip.aviso2{background:var(--av-t);border-color:transparent;color:var(--av)}

#main{overflow-y:auto;overflow-x:hidden;min-height:0;padding:20px 22px 28px;
  overscroll-behavior:contain}
.folha[hidden]{display:none}
.faixa{display:grid;gap:14px;margin-bottom:14px}
.faixa.dois{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

.cx{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:19px 21px;
  box-shadow:var(--sombra);min-width:0}
.cx h3{font-family:"Plus Jakarta Sans",sans-serif;font-size:14px;font-weight:700;margin:0}
.cx .sub{font-size:12.5px;color:var(--texto-3);margin:3px 0 0}
.cxt{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.selo{font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:700;padding:5px 10px;
  border-radius:8px;background:var(--trilho);color:var(--texto-2);white-space:nowrap}
.proc{font-size:11px;color:var(--texto-3);margin:15px 0 0;padding-top:12px;
  border-top:1px solid var(--borda-2);line-height:1.5}
.falhou{background:var(--ruim-t);color:var(--ruim);border-radius:10px;padding:11px 14px;
  font-size:12.5px;margin:0 0 14px;line-height:1.5}
.falhou b{display:block;margin-bottom:3px}
.aviso{background:var(--av-t);color:var(--av);border-radius:10px;padding:11px 14px;
  font-size:12.5px;margin:0 0 14px;line-height:1.5}

/* ---- blocos de métrica: valor grande + o que aquilo significa ---- */
.blocos{display:flex;flex-wrap:wrap;gap:1px;background:var(--borda-2);border-radius:16px;
  overflow:hidden;border:1px solid var(--borda);box-shadow:var(--sombra)}
.bl{background:var(--cartao);padding:16px 18px;display:flex;flex-direction:column;
  flex:1 1 172px;min-width:0}
.bl-r{font-family:"Plus Jakarta Sans",sans-serif;font-size:11.5px;font-weight:700;
  color:var(--texto-2);margin-bottom:8px;line-height:1.3}
.bl-v{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;
  font-size:clamp(20px,1.9vw,25px);letter-spacing:-.03em;line-height:1.08;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-c{display:flex;align-items:baseline;gap:7px;margin-top:8px;flex-wrap:wrap}
.bl-ant{font-size:11px;color:var(--texto-3)}
.bl-ant b{font-family:"Plus Jakarta Sans",sans-serif;font-size:13.5px;font-weight:700;
  color:var(--texto-2);font-variant-numeric:tabular-nums}
.bl-seta{font-size:11.5px;font-weight:700}
.bl-seta.up{color:var(--bom)} .bl-seta.down{color:var(--ruim)} .bl-seta.flat{color:var(--texto-3)}
.bl-e{font-size:11px;color:var(--texto-3);margin-top:9px;line-height:1.45}

/* ---- leitura: o parágrafo que explica os blocos ---- */
.leitura{font-size:15px;line-height:1.68;color:var(--texto-2);max-width:80ch}
.leitura b{color:var(--texto);font-weight:600}

/* ---- ações: o que executar, com o número que sustenta ---- */
.acoes{display:grid;gap:12px}
.acao{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--cartao);
  border:1px solid var(--borda);border-radius:16px;padding:19px 21px;box-shadow:var(--sombra)}
.acao-n{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:15px;color:#fff;
  background:var(--mata);width:34px;height:34px;border-radius:11px;display:grid;
  place-items:center;flex:none}
.acao-c h4{font-family:"Plus Jakarta Sans",sans-serif;font-size:15.5px;font-weight:700;
  margin:0 0 11px;color:var(--texto);letter-spacing:-.01em}
.acao-c p{margin:0;font-size:13.5px;line-height:1.6;color:var(--texto-2);
  display:grid;grid-template-columns:86px 1fr;gap:12px;padding:8px 0;
  border-top:1px solid var(--borda-2)}
.acao-c p span{font-family:"Plus Jakarta Sans",sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--texto-3);padding-top:3px}
.acao-f span{color:var(--d1)!important}

.frase{background:var(--mata);border-radius:16px;padding:23px 25px;color:#fff;margin-bottom:14px}
.frase .et{font-family:"Plus Jakarta Sans",sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:9px}
.frase p{margin:0;font-size:15.5px;line-height:1.62;max-width:84ch}
.nota{margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.16)}
.nota .et{color:rgba(255,255,255,.5)}
.nota textarea{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  border-radius:9px;color:#fff;font:inherit;font-size:13.5px;padding:10px 12px;resize:vertical;
  min-height:52px;line-height:1.5}
.nota textarea::placeholder{color:rgba(255,255,255,.45)}
.nota textarea:focus-visible{outline:2px solid #fff;outline-offset:1px}

table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto;margin:0 -21px -19px;padding:0 21px}
thead th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--borda);
  white-space:nowrap}
thead th.r{text-align:right}
tbody td{padding:12px 12px 12px 0;border-bottom:1px solid var(--borda-2);color:var(--texto-2);
  white-space:nowrap;font-variant-numeric:tabular-nums}
tbody td.r{text-align:right}
tbody td.nm{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;color:var(--texto)}
tbody td.nm span{display:block;font-size:10.5px;color:var(--texto-3);font-weight:400;margin-top:2px}
tbody tr:last-child td{border-bottom:none}
tfoot td{padding:12px;border-top:1px solid var(--borda);font-weight:600;color:var(--texto);
  white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--tela)}
tfoot td.r{text-align:right}
.up{color:var(--bom)} .down{color:var(--ruim)} .flat{color:var(--texto-3)}

.bars{display:flex;align-items:flex-end;gap:9px;height:140px}
.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;
  height:100%;min-width:0}
.bc .bv{font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--texto-3)}
.bc .bb{width:100%;max-width:42px;background:var(--trilho);border-radius:6px 6px 3px 3px;min-height:4px}
.bc.on .bb{background:var(--d1)} .bc.on .bv{color:var(--texto)}
.blabs{display:flex;gap:9px;margin-top:9px;padding-top:9px;border-top:1px solid var(--borda-2)}
.blabs span{flex:1;text-align:center;font-size:10.5px;color:var(--texto-3);min-width:0}

.linha{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--borda-2)}
.linha:last-child{border-bottom:none}
.linha .ln{font-size:13px;color:var(--texto-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .lt{display:block;height:9px;border-radius:99px;background:var(--trilho);overflow:hidden}
.linha .lf{display:block;height:100%;border-radius:99px;min-width:4px}
.linha .lv{font-family:"Plus Jakarta Sans",sans-serif;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;text-align:right;min-width:78px}
.vazio{font-size:13px;color:var(--texto-3);padding:14px 0}
.passos{list-style:none;counter-reset:s;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.passos li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:13px;
  background:var(--cartao);border:1px solid var(--borda);border-radius:13px;padding:15px 17px;
  font-size:14px;color:var(--texto-2)}
.passos li::before{content:counter(s,decimal-leading-zero);
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:14px;color:var(--d1)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1240px){
  .app{grid-template-columns:70px minmax(0,1fr)}
  .lado{padding:20px 11px 16px;align-items:center}
  .logo{padding:0} .logo span:not(.b){display:none}
  .item{justify-content:center;padding:12px 0;gap:0} .item .lbl{display:none} .item .pt{display:none}
  .item[aria-selected="true"]{background:#fff;color:var(--mata)}
  .imp{padding:11px 0} .imp span{display:none}
}
@media (max-width:1080px){.faixa.dois{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  body{padding:0}
  .app{border-radius:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .lado{flex-direction:row;gap:9px;padding:10px 11px;overflow-x:auto;overflow-y:hidden}
  .menu{flex-direction:row;flex:none;gap:4px}
  .item{padding:10px 12px;white-space:nowrap;justify-content:flex-start}
  .item .lbl{display:inline} .imp{display:none}
  .consulta{padding:12px 14px 10px;gap:10px}
  .cd{flex:1 1 100%} .cd input[type=date]{width:auto;flex:1;min-width:0}
  .c-vs{display:none}
  .seg{flex:1 1 auto} .seg button{flex:1;padding:10px 0}
  .puxar{flex:1 1 100%;justify-content:center}
  .ferram{margin-left:auto}
  #main{padding:14px 14px 24px}
  .cx{padding:16px 17px} .tw{margin:0 -17px -16px;padding:0 17px}
  .bl-v{font-size:21px}
  .acao{grid-template-columns:1fr;gap:12px}
  .acao-c p{grid-template-columns:1fr;gap:2px}
  .linha{grid-template-columns:86px minmax(0,1fr) auto;gap:8px}
  .linha .lv{min-width:0}
}
@media print{
  html,body{height:auto;overflow:visible} body{background:#fff;padding:0}
  #main{overflow:visible!important;padding:0}
  .app{box-shadow:none;border-radius:0;display:block;height:auto}
  .lado,.puxar,.ic,.ferram,.seg{display:none!important}
  .cd{border:none;padding:0;background:#fff}
  .tela{display:block;overflow:visible;background:#fff}
  .consulta{border:none;padding:0 0 14px}
  .cx{break-inside:avoid;box-shadow:none}
  .faixa.dois{grid-template-columns:1fr}
}
</style>

/* =========================================================================

   por conversão são calculados na hora, para não haver número que não fecha.
   ========================================================================= */
const RETRATO = {
  puxadoEm:"31/08/2026 (gravado)", aoVivo:false,
  periodo:{atual:{de:"2026-08-24",ate:"2026-08-30"},anterior:{de:"2026-08-17",ate:"2026-08-23"}},

<script>
/* ------------------------------------------------------------- formatação */
const nf0=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>v==null?"—":nf0.format(v);
const brl=v=>v==null?"—":"R$ "+nf2.format(v);
const pct=v=>v==null?"—":nf2.format(v).replace(",00","")+"%";
const seg=v=>v==null?"—":num(v)+"s";
const dm=iso=>{if(!iso)return"";const[a,m,d]=iso.split("-");return `${d}/${m}`};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const div=(a,b)=>(a==null||!b)?null:a/b;

function vari(a,b,inv){
  if(a==null||b==null)return null;
  if(b===0) return a>0 ? {p:null,cls:inv?"down":"up",txt:"▲ vinha de 0"} : null;
  const p=((a-b)/Math.abs(b))*100, bom=inv?p<0:p>0;
  return {p, cls:Math.abs(p)<0.5?"flat":(bom?"up":"down"),
          txt:(p>0?"▲ ":p<0?"▼ ":"")+nf2.format(Math.abs(p)).replace(",00","")+"%"};
}

/* deriva o que é conta: nunca guardo CTR, CPC nem taxa — calculo sempre */
function derivar(x){
  if(!x) return null;
  return {...x,
    ctr:        div(x.cliques, x.impressoes)!=null ? div(x.cliques,x.impressoes)*100 : null,
    cpc:        div(x.custo, x.cliques),
    cpm:        div(x.custo, x.impressoes)!=null ? div(x.custo,x.impressoes)*1000 : null,
    txConv:     div(x.conversoes, x.cliques)!=null ? div(x.conversoes,x.cliques)*100 : null,
    custoConv:  div(x.custo, x.conversoes),
    frequencia: div(x.impressoes, x.alcance),
    connect:    div(x.visitasLP, x.cliques)!=null ? div(x.visitasLP,x.cliques)*100 : null
  };
}

let D = JSON.parse(JSON.stringify(RETRATO));
let FALHAS = {};

/* ---------------------------------------------------------------- consulta */
const CONSERTO = {
  needs_reauth:"A conexão expirou. Reconecte em claude.ai → Configurações → Conectores.",
  server_not_connected:"O conector não está adicionado nesta conta do claude.ai.",
  not_granted:"Permissão não concedida. Clique em Puxar dados de novo e autorize.",
  blocked_by_policy:"Bloqueado por política da organização.",
  approval_required:"A chamada precisa de aprovação de um administrador.",
  selection_required:"Há mais de uma conexão desse conector. Escolha uma no claude.ai.",
  server_not_found:"Conector não encontrado com esse nome.",
  server_unavailable:"O conector não respondeu. Tente puxar de novo.",
  upstream_error:"A plataforma de origem recusou a chamada.",
  rate_limited:"Limite de chamadas atingido. Espere um pouco e puxe de novo.",
  tool_error:"A fonte respondeu com erro.",
  bad_request:"A consulta foi montada de forma inválida.",
  cancelled:"Consulta cancelada.",
  capability_disabled:"A consulta ao vivo está desligada para este painel.",
  capability_removed:"A consulta ao vivo foi removida deste painel.",
  transform_error:"A resposta veio num formato inesperado."
};
const RETENTAVEL=new Set(["server_unavailable","rate_limited"]);

let MCP;
/* fora do viewer do claude.ai a página não tem window.claude — não pode derrubar o resto */
((window.claude && window.claude.use) ? window.claude.use("mcp") : Promise.resolve(null))
  .then(m=>{MCP=m;pintarEstado()}).catch(()=>{MCP=null;pintarEstado()});
const espera=ms=>new Promise(r=>setTimeout(r,ms));

async function chamar(server,tool,input,rotulo){
  if(!MCP) throw {code:"capability_disabled",rotulo};
  for(let t=0;t<2;t++){
    try{ return (await MCP.callTool(server,tool,input,{cache:{refresh:true}})).payload; }
    catch(e){
      const cod=e&&e.code;
      if(t===1 || !(e&&e.retryable===true || RETENTAVEL.has(cod)))
        throw {code:cod||"tool_error",message:e&&e.message,rotulo};
      await espera((e&&e.retryAfterMs)||700+Math.random()*600);
    }
  }
}
const linhas=p=>(p&&Array.isArray(p.result))?p.result:[];
const soma=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);

async function qGoogle(de,ate){
  const r=linhas(await chamar("Windsor.ai","get_data",{connector:"google_ads",
    accounts:[CONTAS.google],
    fields:["campaign","advertising_channel_type","impressions","clicks","cost","conversions"],
    date_from:de,date_to:ate},"Google Ads"));
  const rot=t=>t==="SEARCH"?"Pesquisa":t==="PERFORMANCE_MAX"?"Performance Max":
              t==="DEMAND_GEN"?"YouTube":(t||"Outra");
  const m={};
  r.forEach(x=>{const k=rot(x.advertising_channel_type);
    m[k]=m[k]||{nome:k,impressoes:0,cliques:0,custo:0,conversoes:0};
    m[k].impressoes+=+x.impressions||0; m[k].cliques+=+x.clicks||0;
    m[k].custo+=+x.cost||0; m[k].conversoes+=+x.conversions||0;});
  return {total:{impressoes:soma(r,x=>x.impressions),cliques:soma(r,x=>x.clicks),
                 custo:soma(r,x=>x.cost),conversoes:soma(r,x=>x.conversions)},
          campanhas:Object.values(m).sort((a,b)=>b.custo-a.custo)};
}

async function qMeta(de,ate){
  const base={connector:"facebook",accounts:[CONTAS.meta],date_from:de,date_to:ate};
  /* totais SEM dimensão: só assim o alcance vem deduplicado, igual ao Ads
     Manager — somar o alcance por anúncio conta a mesma pessoa várias vezes */
  const tot=linhas(await chamar("Windsor.ai","get_data",{...base,
    fields:["spend","reach","impressions","actions_link_click",
            "actions_landing_page_view","actions_complete_registration"]},"Meta Ads"))[0]||{};
  const r=linhas(await chamar("Windsor.ai","get_data",{...base,
    fields:["campaign","ad_name","spend","impressions","actions_link_click",
            "actions_complete_registration"]},"Meta Ads"));
  return {total:{alcance:+tot.reach||0,impressoes:+tot.impressions||0,
                 cliques:+tot.actions_link_click||0,custo:+tot.spend||0,
                 conversoes:+tot.actions_complete_registration||0,
                 visitasLP:+tot.actions_landing_page_view||0},
          criativos:r.map(x=>({nome:x.ad_name,campanha:x.campaign,custo:+x.spend||0,
            impressoes:+x.impressions||0,cliques:+x.actions_link_click||0,
            conversoes:+x.actions_complete_registration||0})).sort((a,b)=>b.custo-a.custo)};
}

/* Clarity: uma chamada só. A API devolve os últimos 3 dias e limita ~10 por dia. */
async function qClarity(){
  const r=linhas(await chamar("Windsor.ai","get_data",{connector:"microsoft_clarity",
    accounts:[CONTAS.clarity],
    fields:["date","num_days","metric_type","average_scroll_depth","active_time",
            "total_session_count","distinct_user_count","pages_per_session_percentage",
            "dead_click_sessions_with_metric_percentage","quickback_click_sub_total",
            "rage_click_sub_total"],
    date_preset:"last_3d"},"Comportamento na página"));
  const t=k=>{const l=r.find(x=>x.metric_type===k);return l||{}};
  const tr=t("Traffic"), sd=t("ScrollDepth"), en=t("EngagementTime");
  return {janela:"últimos 3 dias", scroll:sd.average_scroll_depth, tempoAtivo:en.active_time,
          sessoes:tr.total_session_count, usuarios:tr.distinct_user_count,
          paginas:tr.pages_per_session_percentage,
          deadClicks:t("DeadClickCount").dead_click_sessions_with_metric_percentage,
          quickback:t("QuickbackClick").quickback_click_sub_total,
          rage:t("RageClickCount").rage_click_sub_total};
}

function sqlNegocio(de,ate,cde,cate){
  return `WITH j AS (SELECT 'atual'::text AS janela, DATE '${de}' AS de, DATE '${ate}' AS ate
  UNION ALL SELECT 'anterior', DATE '${cde}', DATE '${cate}'),
teste AS (SELECT unnest(ARRAY[${IDS_TESTE}]) AS id)
SELECT j.janela,
 (SELECT count(*) FROM professional p WHERE p.deleted_at IS NULL
   AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate) AS cadastros,
 (SELECT count(*) FROM professional p WHERE p.deleted_at IS NULL
   AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate
   AND p.onboarding_step = 'FINISHED') AS onboarding,
 (SELECT count(*) FROM professional p JOIN professional_account a ON a.professional_id = p.id
   WHERE p.deleted_at IS NULL AND p.id NOT IN (SELECT id FROM teste)
   AND p.created_at::date BETWEEN j.de AND j.ate AND a.status = 'ACTIVE') AS contas_ativas,
 (SELECT count(*) FROM checkout_session c WHERE c.paid_at IS NOT NULL
   AND c.paid_at::date BETWEEN j.de AND j.ate) AS pagamentos,
 (SELECT COALESCE(sum((c.price->>'amount')::numeric),0)/100 FROM checkout_session c
   WHERE c.paid_at IS NOT NULL AND c.paid_at::date BETWEEN j.de AND j.ate) AS gmv
FROM j ORDER BY j.janela DESC`;
}
async function qNegocio(de,ate,cde,cate){
  const p=await chamar("Metabase","execute_sql",
    {database_id:CONTAS.metabaseDb,sql:sqlNegocio(de,ate,cde,cate)},"Negócio");
  const rows=(p&&p.data&&Array.isArray(p.data.rows))?p.data.rows:[];
  const ler=n=>{const l=rows.find(r=>r[0]===n);
    return l?{cadastros:+l[1],onboarding:+l[2],contasAtivas:+l[3],pagamentos:+l[4],gmv:+l[5]}:null};
  return {atual:ler("atual"),anterior:ler("anterior")};
}

async function puxar(){
  const de=inDe.value,ate=inAte.value,cde=inCDe.value,cate=inCAte.value;
  if(!de||!ate||de>ate||!cde||!cate||cde>cate){
    FALHAS={periodo:{rotulo:"Período",code:"bad_request"}}; desenhar(); return;
  }
  btPuxar.disabled=true; btPuxar.classList.add("indo"); txPuxar.textContent="Puxando…";
  FALHAS={};
  const tarefas=[
    ["gA",()=>qGoogle(de,ate)],   ["gB",()=>qGoogle(cde,cate)],
    ["mA",()=>qMeta(de,ate)],     ["mB",()=>qMeta(cde,cate)],
    ["oA",()=>qOpenai(de,ate)],   ["oB",()=>qOpenai(cde,cate)],
    ["sA",()=>qSessoes(de,ate)],  ["sB",()=>qSessoes(cde,cate)],
    ["cl",()=>qClarity()],        ["ng",()=>qNegocio(de,ate,cde,cate)]
  ];
  const R={};
  await Promise.all(tarefas.map(async([k,f])=>{
    try{ R[k]=await f() }catch(e){ R[k]=null; FALHAS[k]=e }
  }));

  const novo=JSON.parse(JSON.stringify(RETRATO));
  novo.aoVivo=true; novo.puxadoEm=`${dm(de)}–${dm(ate)} · consultado agora`;
  novo.periodo={atual:{de,ate},anterior:{de:cde,ate:cate}};
  novo.google={atual:R.gA&&R.gA.total, anterior:R.gB&&R.gB.total,
    campanhas:(R.gA&&R.gA.campanhas)||[], erro:msg("gA")};
  novo.meta={atual:R.mA&&R.mA.total, anterior:R.mB&&R.mB.total,
    criativos:(R.mA&&R.mA.criativos)||[], erro:msg("mA")};
  novo.openai={atual:R.oA&&R.oA.total, anterior:R.oB&&R.oB.total, erro:msg("oA")};
  novo.lp={sessoes:{atual:R.sA,anterior:R.sB}, clarity:R.cl,
    erroSessoes:msg("sA"), erroClarity:msg("cl")};
  novo.negocio={atual:(R.ng&&R.ng.atual)||null, anterior:(R.ng&&R.ng.anterior)||null,
    erro:msg("ng")};
  novo.gmvSemanal=RETRATO.gmvSemanal; novo.passos=RETRATO.passos;
  D=novo;
  btPuxar.disabled=false; btPuxar.classList.remove("indo"); txPuxar.textContent="Puxar dados";
  desenhar();
}
const msg=k=>{
  const f=FALHAS[k]; if(!f) return null;
  if(f.code==="tool_error" && f.message) return f.message;
  return CONSERTO[f.code]||f.message||"não veio";
};

const cx=(i,c)=>`<section class="cx ${c||""}">${i}</section>`;
const cxt=(t,s,se)=>`<div class="cxt"><div><h3>${t}</h3>${s?`<p class="sub">${s}</p>`:""}</div>${se?`<span class="selo">${se}</span>`:""}</div>`;

/* bloco de métrica: valor de agora, o NÚMERO REAL do período de comparação
   (nada de porcentagem — pedido dos founders) e uma linha dizendo o que é.
   modo: "inv" = cair é bom (custos) · "neutro" = sem julgamento (investimento) */
function rotuloAnt(){
  const pa=D.periodo.anterior;
  if(pa && ehMesCalendario(pa.de,pa.ate))
    return new Date(pa.de+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"});
  return "anterior";
}
function B(rot,fmt,a,b,expl,modo){
  let cmp="";
  if(b!=null){
    let seta="";
    if(a!=null && a!==b){
      const subiu=a>b;
      const bom = modo==="neutro" ? null : (modo==="inv" ? !subiu : subiu);
      const cls = bom==null ? "flat" : (bom ? "up" : "down");
      seta=`<span class="bl-seta ${cls}">${subiu?"▲":"▼"}</span>`;
    }
    cmp=`<div class="bl-c"><span class="bl-ant">${rotuloAnt()} <b>${fmt(b)}</b></span>${seta}</div>`;
  }
  return `<div class="bl">
    <div class="bl-r">${rot}</div>
    <div class="bl-v">${fmt(a)}</div>
    ${cmp}
    ${expl?`<div class="bl-e">${expl}</div>`:""}
  </div>`;
}
const blocos=h=>`<div class="blocos">${h}</div>`;

function semDados(rotulo,motivo){
  return cx(cxt(rotulo,"Este canal não trouxe dados nesta janela.")
    + `<p class="falhou"><b>Não foi possível ler</b>${esc(motivo||"sem dados no período")}</p>`);
}
function resumoCx(texto){
  return cx(cxt("O que esses números dizem","Leitura direta, sem jargão.")
    + `<div class="leitura">${texto}</div>`);
}

/* ----------------------------------------------------------------- Resumo */
function vResumo(){
  const g=derivar(D.google&&D.google.atual), m=derivar(D.meta&&D.meta.atual),
        o=derivar(D.openai&&D.openai.atual);
  const gB=derivar(D.google&&D.google.anterior), mB=derivar(D.meta&&D.meta.anterior),
        oB=derivar(D.openai&&D.openai.anterior);
  const inv=(g?g.custo:0)+(m?m.custo:0)+(o?o.custo:0);
  const invB=(gB?gB.custo:0)+(mB?mB.custo:0)+(oB?oB.custo:0);
  const n=D.negocio&&D.negocio.atual, nB=D.negocio&&D.negocio.anterior;
  const cpc=n?div(inv,n.cadastros):null, cpcB=nB?div(invB,nB.cadastros):null;
  const gmv=D.gmvSemanal, ult=gmv.length-1, mx=Math.max(...gmv.map(x=>x.gmv));

  const canais=[
    {n:"Google Ads",d:g,cor:"var(--d2)"},{n:"Meta Ads",d:m,cor:"var(--d3)"},
    {n:"OpenAI Ads",d:o,cor:"var(--d1)"}
  ].filter(c=>c.d);
  const maxC=Math.max(...canais.map(c=>c.d.custo),1);

  const et=n?[{n:"Visitas na página",v:D.lp&&D.lp.sessoes?D.lp.sessoes.atual:null},
    {n:"Cadastros",v:n.cadastros},{n:"Configuraram",v:n.onboarding},
    {n:"Conta ativa",v:n.contasAtivas}]:[];
  const maxE=Math.max(...et.map(e=>e.v||0),1);

  return `
  <div class="frase">
    <div class="et">A semana em uma frase</div>
    <p>${D.aoVivo
      ? `Investimos <b>${brl(inv)}</b> e trouxemos <b>${num(n?n.cadastros:null)}</b> cadastros novos, a <b>${brl(cpc)}</b> cada. O produto transacionou <b>${brl(n?n.gmv:null)}</b> em <b>${num(n?n.pagamentos:null)}</b> pagamentos.`
      : esc("Com os três canais somados, o investimento ficou estável (R$ 1.883 contra R$ 1.877), mas os cadastros caíram pela metade: 65 contra 128 — o custo por cadastro foi de R$ 14,66 para R$ 28,98. Houve troca de canal: Performance Max, Visita ao Perfil e o OpenAI (pausado de 24 a 28/08) saíram de cena, e o Meta mais que dobrou de verba. Do lado bom, o Google Pesquisa voltou a converter e o GMV subiu 77%.")}</p>
    <div class="nota"><div class="et">Observação do período</div>
      <textarea id="obs" placeholder="Ex: agosto foi atípico — houve um erro de tratamento nas duas últimas semanas, então parte dos dados não reflete operação normal."></textarea></div>
  </div>

  ${D.negocio&&D.negocio.erro?`<p class="falhou"><b>Dados de negócio não vieram</b>${esc(D.negocio.erro)}</p>`:""}
  ${blocos(
    B("Investimento",brl,inv,invB,"Soma dos três canais","neutro") +
    B("Cadastros novos",num,n?n.cadastros:null,nB?nB.cadastros:null,"Profissionais que entraram") +
    B("Custo por cadastro",brl,cpc,cpcB,"Investimento ÷ cadastros","inv") +
    B("Pagamentos",num,n?n.pagamentos:null,nB?nB.pagamentos:null,"Transações concluídas") +
    B("GMV",brl,n?n.gmv:null,nB?nB.gmv:null,"Valor que passou pelo produto")
  )}

  <div class="faixa dois" style="margin-top:14px">
    ${cx(cxt("Do visitante ao profissional pagando","Quantas pessoas sobram em cada etapa.")
      + (et.length? et.map(e=>`<div class="linha"><span class="ln">${esc(e.n)}</span>
          <span class="lt"><span class="lf" style="width:${Math.max((e.v||0)/maxE*100,2)}%;background:var(--d1)"></span></span>
          <span class="lv">${num(e.v)}</span></div>`).join("")
        : `<p class="vazio">Sem dados de negócio nesta consulta.</p>`))}
    ${cx(cxt("Onde o dinheiro foi","Gasto por canal no período.")
      + (canais.length? canais.map(c=>`<div class="linha"><span class="ln">${esc(c.n)}</span>
          <span class="lt"><span class="lf" style="width:${Math.max(c.d.custo/maxC*100,2)}%;background:${c.cor}"></span></span>
          <span class="lv">${brl(c.d.custo)}</span></div>`).join("")
        : `<p class="vazio">Nenhum canal trouxe dados.</p>`))}
  </div>

  <div class="faixa">
    ${cx(cxt("GMV por semana","Quanto passou pelo produto, semana a semana.",`${gmv.length} semanas`)
      + `<div class="bars">${gmv.map((s,i)=>`<div class="bc ${i===ult?"on":""}" title="${s.semana}: ${brl(s.gmv)}">
          <span class="bv">${nf0.format(s.gmv)}</span>
          <span class="bb" style="height:${Math.max(s.gmv/mx*100,3)}%"></span></div>`).join("")}</div>
        <div class="blabs">${gmv.map(s=>`<span>${s.semana}</span>`).join("")}</div>`
      + `<p class="proc">Série gravada — as seis semanas não vêm da consulta ao vivo.</p>`)}
  </div>`;
}

/* ------------------------------------------------------------- Google Ads */
function vGoogle(){
  const a=derivar(D.google&&D.google.atual), b=derivar(D.google&&D.google.anterior);
  if(!a) return semDados("Google Ads", D.google&&D.google.erro);
  const camp=(D.google.campanhas||[]).map(derivar).filter(c=>c.custo>0);

  let txt = `O canal consumiu <b>${brl(a.custo)}</b> e apareceu <b>${num(a.impressoes)}</b> vezes. `;
  txt += `De cada 100 pessoas que viram o anúncio, <b>${a.ctr!=null?nf1.format(a.ctr):"—"}</b> clicaram, `;
  txt += `e cada clique custou <b>${brl(a.cpc)}</b>. `;
  if(a.conversoes>0){
    txt += `Vieram <b>${num(a.conversoes)}</b> conversões, ou seja <b>${a.txConv!=null?nf1.format(a.txConv):"—"}%</b> `;
    txt += `dos cliques viraram cadastro, a <b>${brl(a.custoConv)}</b> cada.`;
    if(b && b.conversoes===0) txt += ` Na janela anterior não houve nenhuma conversão — o canal voltou a funcionar.`;
    else if(b && b.custoConv!=null){
      const d=vari(a.custoConv,b.custoConv,true);
      txt += ` Antes cada cadastro custava ${brl(b.custoConv)}, então ficou ${d&&d.cls==="up"?"<b>mais barato</b>":"<b>mais caro</b>"}.`;
    }
  } else {
    txt += `Não houve nenhuma conversão registrada nesta janela — todo o gasto foi para tráfego sem cadastro medido.`;
  }
  if(camp.length>1){
    const melhor=camp.filter(c=>c.conversoes>0).sort((x,y)=>x.custoConv-y.custoConv)[0];
    const caro=camp.filter(c=>c.conversoes===0&&c.custo>0).sort((x,y)=>y.custo-x.custo)[0];
    if(melhor) txt += ` A campanha mais eficiente foi <b>${esc(melhor.nome)}</b>, a ${brl(melhor.custoConv)} por conversão.`;
    if(caro) txt += ` A <b>${esc(caro.nome)}</b> gastou ${brl(caro.custo)} sem nenhuma conversão.`;
  }

  return `
  ${blocos(
    B("Impressões",num,a.impressoes,b&&b.impressoes,"Vezes que o anúncio apareceu") +
    B("Cliques",num,a.cliques,b&&b.cliques,"Quantas pessoas clicaram") +
    B("CTR",pct,a.ctr,b&&b.ctr,"De 100 que viram, quantos clicaram") +
    B("CPC",brl,a.cpc,b&&b.cpc,"Quanto custou cada clique","inv") +
    B("Conversões",num,a.conversoes,b&&b.conversoes,"Cadastros que o Google atribuiu") +
    B("Tx. conversão",pct,a.txConv,b&&b.txConv,"De 100 cliques, quantos viraram cadastro") +
    B("Custo por conversão",brl,a.custoConv,b&&b.custoConv,"Quanto custou cada cadastro","inv") +
    B("Investimento",brl,a.custo,b&&b.custo,"Total gasto no canal","neutro")
  )}
  <div class="faixa" style="margin-top:14px">${resumoCx(txt)}</div>
  ${camp.length?`<div class="faixa">${cx(cxt("Por campanha","Só as que gastaram no período.")
    + `<div class="tw"><table><thead><tr><th>Campanha</th><th class="r">Investimento</th>
      <th class="r">Impressões</th><th class="r">Cliques</th><th class="r">CTR</th>
      <th class="r">Conversões</th><th class="r">Por conversão</th></tr></thead>
      <tbody>${camp.map(c=>`<tr><td class="nm">${esc(c.nome)}</td>
        <td class="r">${brl(c.custo)}</td><td class="r">${num(c.impressoes)}</td>
        <td class="r">${num(c.cliques)}</td><td class="r">${pct(c.ctr)}</td>
        <td class="r">${num(c.conversoes)}</td><td class="r">${brl(c.custoConv)}</td></tr>`).join("")}</tbody>
      </table></div>`)}</div>`:""}`;
}

/* --------------------------------------------------------------- Meta Ads */
function vMeta(){
  const a=derivar(D.meta&&D.meta.atual), b=derivar(D.meta&&D.meta.anterior);
  if(!a) return semDados("Meta Ads", D.meta&&D.meta.erro);
  const cri=(D.meta.criativos||[]).map(derivar).filter(c=>c.custo>0);

  let txt = `O canal alcançou <b>${num(a.alcance)}</b> pessoas diferentes e apareceu <b>${num(a.impressoes)}</b> vezes — `;
  txt += `ou seja, cada pessoa viu o anúncio <b>${a.frequencia!=null?nf1.format(a.frequencia):"—"}</b> vezes em média. `;
  txt += `Foram <b>${num(a.cliques)}</b> cliques no link, a <b>${brl(a.cpc)}</b> cada. `;
  if(a.connect!=null) txt += `Desses cliques, <b>${nf1.format(a.connect)}%</b> chegaram de verdade na página — o resto desistiu no caminho. `;
  if(a.conversoes>0){
    txt += `O pixel registrou <b>${num(a.conversoes)}</b> cadastros, a <b>${brl(a.custoConv)}</b> cada.`;
  } else {
    txt += `O pixel não registrou nenhum cadastro nesta janela.`;
  }
  if(cri.length){
    const bons=cri.filter(c=>c.conversoes>0).sort((x,y)=>x.custoConv-y.custoConv);
    const zerados=cri.filter(c=>c.conversoes===0);
    if(bons.length) txt += ` O anúncio mais eficiente foi <b>${esc(bons[0].nome)}</b>, a ${brl(bons[0].custoConv)} por cadastro.`;
    if(zerados.length) txt += ` <b>${zerados.length}</b> ${zerados.length===1?"anúncio":"anúncios"} gastaram ${brl(zerados.reduce((s,c)=>s+c.custo,0))} sem nenhum cadastro.`;
  }

  return `
  ${blocos(
    B("Alcance",num,a.alcance,b&&b.alcance,"Pessoas diferentes que viram") +
    B("Impressões",num,a.impressoes,b&&b.impressoes,"Vezes que o anúncio apareceu") +
    B("Frequência",v=>v!=null?nf1.format(v):"—",a.frequencia,b&&b.frequencia,"Vezes que a mesma pessoa viu","inv") +
    B("CPM",brl,a.cpm,b&&b.cpm,"Custo para aparecer mil vezes","inv") +
    B("Cliques no link",num,a.cliques,b&&b.cliques,"Quantas pessoas clicaram") +
    B("CTR",pct,a.ctr,b&&b.ctr,"De 100 que viram, quantos clicaram") +
    B("Chegaram na página",pct,a.connect,b&&b.connect,"Cliques que viraram visita de verdade") +
    B("Conversões",num,a.conversoes,b&&b.conversoes,"Cadastros registrados pelo pixel") +
    B("Tx. conversão",pct,a.txConv,b&&b.txConv,"De 100 cliques, quantos viraram cadastro") +
    B("Custo por conversão",brl,a.custoConv,b&&b.custoConv,"Quanto custou cada cadastro","inv") +
    B("Investimento",brl,a.custo,b&&b.custo,"Total gasto no canal","neutro")
  )}
  <div class="faixa" style="margin-top:14px">${resumoCx(txt)}</div>
  ${cri.length?`<div class="faixa">${cx(cxt("Anúncio por anúncio","Ordenados por quanto consumiram.")
    + `<div class="tw"><table><thead><tr><th>Anúncio</th><th class="r">Investimento</th>
      <th class="r">Impressões</th><th class="r">Cliques</th><th class="r">CTR</th>
      <th class="r">Conversões</th><th class="r">Por conversão</th></tr></thead>
      <tbody>${cri.map(c=>`<tr><td class="nm">${esc(c.nome)}<span>${esc(c.campanha||"")}</span></td>
        <td class="r">${brl(c.custo)}</td><td class="r">${num(c.impressoes)}</td>
        <td class="r">${num(c.cliques)}</td><td class="r">${pct(c.ctr)}</td>
        <td class="r">${num(c.conversoes)}</td><td class="r">${brl(c.custoConv)}</td></tr>`).join("")}</tbody>
      </table></div>`)}</div>`:""}`;
}

/* ------------------------------------------------------------ Landing Page */
function vLP(){
  const s=D.lp&&D.lp.sessoes, c=D.lp&&D.lp.clarity;
  let txt="";
  if(s&&s.atual!=null){
    const v=vari(s.atual,s.anterior);
    txt += `A página recebeu <b>${num(s.atual)}</b> visitas no período`;
    txt += v?`, ${v.cls==="up"?"<b>mais</b>":"<b>menos</b>"} que as ${num(s.anterior)} da janela anterior. `:". ";
  }
  if(c&&c.scroll!=null){
    txt += `Quem chegou desceu em média <b>${pct(c.scroll)}</b> da página e ficou <b>${seg(c.tempoAtivo)}</b> ativo. `;
    txt += c.scroll<25
      ? `Abaixo de 25% significa que a maioria não passa da primeira dobra — o que está embaixo praticamente não é visto.`
      : `Isso indica que a página está sendo lida além da primeira dobra.`;
  }

  return `
  ${D.lp&&D.lp.erroSessoes?`<p class="falhou"><b>Visitas não vieram</b>${esc(D.lp.erroSessoes)}</p>`:""}
  ${s&&s.atual!=null?blocos(
    B("Visitas na página",num,s.atual,s.anterior,"Sessões em miaapp.com.br, na janela escolhida")
  ):""}

  <div class="faixa" style="margin-top:14px">
    ${D.lp&&D.lp.erroClarity
      ? cx(cxt("Comportamento na página","Microsoft Clarity")
          + `<p class="falhou"><b>Clarity não veio</b>${esc(D.lp.erroClarity)}</p>`)
      : (c ? cx(cxt("Comportamento na página","Como as pessoas se comportam depois de chegar.",
                    "últimos 3 dias")
          + `<p class="aviso">A API do Clarity só devolve os <b>últimos 3 dias</b> — estes números
             não são da janela que você escolheu acima.</p>`
          + blocos(
            B("Rolagem",pct,c.scroll,null,"Até onde o visitante desce na página") +
            B("Tempo ativo",seg,c.tempoAtivo,null,"Tempo realmente interagindo") +
            B("Sessões",num,c.sessoes,null,"Visitas nos 3 dias") +
            B("Páginas por sessão",v=>v!=null?nf1.format(v):"—",c.paginas,null,"Quantas páginas cada um viu") +
            B("Cliques mortos",pct,c.deadClicks,null,"Clique em algo que parece botão e não é") +
            B("Quickback",num,c.quickback,null,"Cliques de quem entra e volta na hora") +
            B("Rage clicks",num,c.rage,null,"Cliques repetidos de irritação")
          ))
        : cx(cxt("Comportamento na página","Microsoft Clarity")
            + `<p class="vazio">Clique em Puxar dados para trazer o comportamento na página.</p>`))}
  </div>

  ${txt?`<div class="faixa">${resumoCx(txt)}</div>`:""}`;
}

const VISTAS=[
  {id:"resumo",nome:"Resumo",     ic:"casa",     r:vResumo},
  {id:"google",nome:"Google Ads", ic:"gads",  marca:true, r:vGoogle},
  {id:"meta",  nome:"Meta Ads",   ic:"metaf", marca:true, r:vMeta},
  {id:"openai",nome:"OpenAI Ads", ic:"oai",   marca:true, r:vOpenai},
  {id:"lp",    nome:"Landing Page",ic:"tela",    r:vLP},
  {id:"passos",nome:"Próximos passos",ic:"bandeira",r:vPassos}
];

const menu=document.getElementById("menu"), main=document.getElementById("main");
VISTAS.forEach((v,i)=>{
  const b=document.createElement("button");
  b.className="item"; b.type="button"; b.id="it-"+v.id; b.title=v.nome;
  b.setAttribute("role","tab"); b.setAttribute("aria-controls","v-"+v.id);
  b.setAttribute("aria-selected",i===0?"true":"false");
  b.innerHTML=`<svg viewBox="0 0 24 24" class="${v.marca?"marca":""}" aria-hidden="true">${IC[v.ic]}</svg>
    <span class="lbl">${v.nome}</span><span class="pt" aria-hidden="true"></span>`;
  b.addEventListener("click",()=>abrir(v.id));
  b.addEventListener("keydown",e=>{
    const p={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key]; if(!p)return;
    e.preventDefault();
    const al=VISTAS[(i+p+VISTAS.length)%VISTAS.length];
    abrir(al.id); document.getElementById("it-"+al.id).focus();
  });
  menu.appendChild(b);
  const s=document.createElement("section");
  s.className="folha"; s.id="v-"+v.id;
  s.setAttribute("role","tabpanel"); s.setAttribute("aria-labelledby","it-"+v.id);
  if(i>0) s.hidden=true;
  main.appendChild(s);
});
function abrir(id){
  VISTAS.forEach(v=>{
    const on=v.id===id;
    document.getElementById("it-"+v.id).setAttribute("aria-selected",on?"true":"false");
    document.getElementById("v-"+v.id).hidden=!on;
  });
  main.scrollTop=0;
  try{localStorage.setItem("mia:vista",id)}catch(e){}
}

const elEstado=document.getElementById("estado");
function pintarEstado(){
  /* a linha de estado descreve a SELEÇÃO (o que o botão vai puxar);
     o último pedaço diz de onde vieram os dados que estão na tela */
  const de=inDe.value, ate=inAte.value, cde=inCDe.value, cate=inCAte.value;
  const dias=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000)+1;
  const chip=(txt,cls,ponto)=>`<span class="chip ${cls||""}">${ponto?"<i></i>":""}${txt}</span>`;
  const t=[];
  if(de&&ate&&cde&&cate&&de<=ate&&cde<=cate){
    const d1=dias(de,ate), d2=dias(cde,cate);
    const doisMeses = ehMesCalendario(de,ate) && ehMesCalendario(cde,cate);
    if(doisMeses){
      t.push(chip(`${nomeMes(de)} vs ${nomeMes(cde)}`));
      t.push(chip("meses fechados"));
    } else {
      t.push(chip(`${dm(de)}–${dm(ate)} vs ${dm(cde)}–${dm(cate)}`));
      t.push(d1===d2 ? chip(`${d1} dias cada`)
                     : chip(`${d1} vs ${d2} dias — tamanhos diferentes`,"mal"));
    }
    const naTela = D.periodo.atual.de===de && D.periodo.atual.ate===ate &&
                   D.periodo.anterior.de===cde && D.periodo.anterior.ate===cate;
    if(!naTela) t.push(chip("período novo — clique em Puxar dados","acao"));
  }
  t.push(D.aoVivo ? chip("dados ao vivo","vivo",true)
                  : chip(`retrato de ${esc(D.puxadoEm).replace(" (gravado)","")}`,"foto",true));
  if(MCP===null) t.push(chip("consulta ao vivo indisponível fora do claude.ai","aviso2"));
  elEstado.innerHTML=t.join("");
  btPuxar.disabled=(MCP===null);
  if(MCP===null) btPuxar.title="Abra o painel dentro do claude.ai para consultar ao vivo.";
}

function desenhar(){
  VISTAS.forEach(v=>{document.getElementById("v-"+v.id).innerHTML=v.r()});
  pintarEstado();
  const t=document.getElementById("obs");
  if(t){
    try{t.value=localStorage.getItem("mia:obs")||""}catch(e){}
    t.addEventListener("input",()=>{try{localStorage.setItem("mia:obs",t.value)}catch(e){}});
  }
}

const inDe=document.getElementById("de"), inAte=document.getElementById("ate");
const inCDe=document.getElementById("cde"), inCAte=document.getElementById("cate");
const btPuxar=document.getElementById("btPuxar"), txPuxar=document.getElementById("txPuxar");
const menos=(iso,d)=>{const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()-d);
  return x.toISOString().slice(0,10)};
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* um período é um mês-calendário quando vai do dia 1 ao último dia do mesmo mês */
function ehMesCalendario(de,ate){
  if(!de||!ate) return false;
  const a=new Date(de+"T12:00:00"), b=new Date(ate+"T12:00:00");
  if(a.getDate()!==1) return false;
  if(a.getFullYear()!==b.getFullYear()||a.getMonth()!==b.getMonth()) return false;
  const ultimo=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
  return b.getDate()===ultimo;
}
const nomeMes=iso=>{const d=new Date(iso+"T12:00:00");
  return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};

function preencher(de,ate,cde,cate){
  inDe.value=isoLocal(de); inAte.value=isoLocal(ate);
  inCDe.value=isoLocal(cde); inCAte.value=isoLocal(cate);
  pintarEstado();
}
function atalhoSemana(){
  const hoje=new Date(); const dow=(hoje.getDay()+6)%7;      /* 0 = segunda */
  const fim=new Date(hoje); fim.setDate(hoje.getDate()-dow-1); /* domingo passado */
  const ini=new Date(fim);  ini.setDate(fim.getDate()-6);
  const fimB=new Date(ini); fimB.setDate(ini.getDate()-1);
  const iniB=new Date(fimB); iniB.setDate(fimB.getDate()-6);
  preencher(ini,fim,iniB,fimB);
}
function atalhoMes(){
  const hoje=new Date();
  const fim=new Date(hoje.getFullYear(),hoje.getMonth(),0);     /* último dia do mês passado */
  const ini=new Date(fim.getFullYear(),fim.getMonth(),1);
  const fimB=new Date(ini.getFullYear(),ini.getMonth(),0);
  const iniB=new Date(fimB.getFullYear(),fimB.getMonth(),1);
  preencher(ini,fim,iniB,fimB);
}
function encaixar(){
  const de=inDe.value,ate=inAte.value; if(!de||!ate||de>ate)return;
  const n=Math.round((new Date(ate)-new Date(de))/86400000);
  inCAte.value=menos(de,1); inCDe.value=menos(inCAte.value,n);
}
inDe.value=RETRATO.periodo.atual.de;   inAte.value=RETRATO.periodo.atual.ate;
inCDe.value=RETRATO.periodo.anterior.de; inCAte.value=RETRATO.periodo.anterior.ate;
[inDe,inAte].forEach(e=>e.addEventListener("change",()=>{encaixar();pintarEstado()}));
[inCDe,inCAte].forEach(e=>e.addEventListener("change",pintarEstado));
btPuxar.addEventListener("click",puxar);
document.getElementById("btSemana").addEventListener("click",atalhoSemana);
document.getElementById("btMes").addEventListener("click",atalhoMes);

const SOL='<circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>';
const LUA='<path d="M20 14.5A8.4 8.4 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>';
const icTema=document.getElementById("icTema");
function tema(t){
  if(t)document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const e2=t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches);
  icTema.innerHTML=e2?SOL:LUA;
  try{t?localStorage.setItem("mia:tema",t):localStorage.removeItem("mia:tema")}catch(e){}
}
document.getElementById("btTema").addEventListener("click",()=>{
  const at=document.documentElement.getAttribute("data-theme");
  const es=at==="dark"||(!at&&matchMedia("(prefers-color-scheme:dark)").matches);
  tema(es?"light":"dark");
});
document.getElementById("btImp").addEventListener("click",()=>window.print());

desenhar();
try{
  const s=localStorage.getItem("mia:vista");
  if(s&&VISTAS.some(v=>v.id===s)) abrir(s);
  tema(localStorage.getItem("mia:tema"));
}catch(e){tema(null)}
</script>
