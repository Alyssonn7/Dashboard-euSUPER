<title>Painel Semanal Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap">

<style>
:root{
  --brand:#004AAD; --brand-ink:#004AAD;
  --ground:#F4F7FB; --surface:#FFFFFF; --surface-2:#EBF0F8;
  --ink:#0B1729; --ink-2:#3E4F67; --ink-3:#6D7E96;
  --rule:#D7DFEC; --rule-2:#E9EEF6;
  --up:#00703C; --down:#B3261E; --flat:#6D7E96;
  --up-wash:#E3F3EA; --down-wash:#FBE9E7;
  --c-meta:#2563EB; --c-google:#D14009; --c-openai:#00875A;
  --shadow:0 1px 2px rgba(11,23,41,.05), 0 6px 20px rgba(11,23,41,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#7FA8F0; --brand-ink:#9CC0FF;
    --ground:#080F1C; --surface:#101A2C; --surface-2:#18243A;
    --ink:#E9EFF9; --ink-2:#B0BED3; --ink-3:#7F90A9;
    --rule:#26344C; --rule-2:#1B2740;
    --up:#4BC98A; --down:#F08A80; --flat:#7F90A9;
    --up-wash:#0F2B20; --down-wash:#331A18;
    --c-meta:#5C93F0; --c-google:#EA7B4A; --c-openai:#3BB584;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --brand:#7FA8F0; --brand-ink:#9CC0FF;
  --ground:#080F1C; --surface:#101A2C; --surface-2:#18243A;
  --ink:#E9EFF9; --ink-2:#B0BED3; --ink-3:#7F90A9;
  --rule:#26344C; --rule-2:#1B2740;
  --up:#4BC98A; --down:#F08A80; --flat:#7F90A9;
  --up-wash:#0F2B20; --down-wash:#331A18;
  --c-meta:#5C93F0; --c-google:#EA7B4A; --c-openai:#3BB584;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- topo */
.topbar{background:var(--brand);color:#fff;padding:18px 0}
:root[data-theme="dark"] .topbar{background:#0D2244}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{background:#0D2244}}
.bar-in{
  max-width:1180px;margin:0 auto;padding:0 22px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.brand{font-family:"Montserrat",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:600;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:2px}
.periodo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-family:"Montserrat",sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.fld input{
  font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
  padding:6px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:#fff;color-scheme:dark;
}
.fld input:focus{outline:2px solid #fff;outline-offset:1px}
.vs{font-size:12px;color:rgba(255,255,255,.75);padding-bottom:7px;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- abas */
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 14px;display:flex;gap:2px;overflow-x:auto}
.tab{
  font-family:"Montserrat",sans-serif;font-size:12.5px;font-weight:700;
  padding:13px 15px;color:var(--ink-3);white-space:nowrap;cursor:pointer;
  border:none;background:none;border-bottom:2px solid transparent;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand-ink)}
.tab:focus-visible{outline:2px solid var(--brand-ink);outline-offset:-3px}

main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
.panel[hidden]{display:none}

h2{font-family:"Montserrat",sans-serif;font-size:19px;font-weight:700;
  margin:0 0 4px;letter-spacing:-.01em}
h3{font-family:"Montserrat",sans-serif;font-size:14px;font-weight:700;margin:0 0 10px}
.hint{color:var(--ink-3);font-size:13.5px;margin:0 0 18px;max-width:78ch}
.block{margin-bottom:34px}

/* ------------------------------------------------------- veredito */
.veredito{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--brand-ink);
  border-radius:10px;padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow);
}
.veredito .lb{font-family:"Montserrat",sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:7px}
.veredito p{margin:0;font-size:15px;color:var(--ink);max-width:82ch}

/* ------------------------------------------------------------ KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:15px 17px;box-shadow:var(--shadow)}
.kpi .l{font-family:"Montserrat",sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.kpi .v{font-family:"Montserrat",sans-serif;font-size:24px;font-weight:800;
  letter-spacing:-.02em;line-height:1.08;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px}
.kpi .d.up{color:var(--up);background:var(--up-wash)}
.kpi .d.down{color:var(--down);background:var(--down-wash)}
.kpi .d.flat{color:var(--flat);background:var(--surface-2)}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:6px}

/* --------------------------------------------------------- tabelas */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);
  box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:"Montserrat",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;padding:11px 14px;
  background:var(--surface-2);border-bottom:1px solid var(--rule);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.nm{color:var(--ink);font-weight:600}
tfoot td{background:var(--surface-2);color:var(--ink);font-weight:700;
  border-top:1px solid var(--rule);border-bottom:none}
.mini{font-size:11.5px;color:var(--ink-3);font-weight:400}

/* --------------------------------------------------------- gráficos */
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px;box-shadow:var(--shadow)}
.chart h3{margin-bottom:3px}
.chart .cap{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

/* barras horizontais */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:var(--lw,132px) 1fr auto;gap:12px;align-items:center}
.hbar .nm{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{display:block;background:var(--surface-2);border-radius:4px;height:22px;
  position:relative;overflow:hidden}
.hbar .fill{display:block;height:100%;border-radius:4px;background:var(--brand-ink);min-width:3px;
  transition:width .35s ease}
.hbar .vl{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);
  font-weight:700;min-width:74px;text-align:right}
.hbar.alerta .fill{background:var(--down)}
.hbar.alerta .nm,.hbar.alerta .vl{color:var(--down)}
.step-pct{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* barras verticais */
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.vbar .col{width:100%;background:var(--brand-ink);border-radius:4px 4px 0 0;min-height:3px;
  transition:height .35s ease}
.vbar .lb{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vbar .vv{font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* lista */
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{
  counter-increment:s;background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:14px 18px 14px 52px;position:relative;color:var(--ink-2);font-size:14px;
  box-shadow:var(--shadow);
}
.steps li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:17px;top:13px;
  font-family:"Montserrat",sans-serif;font-weight:800;font-size:13px;color:var(--brand-ink);
}
.notes{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px 20px;box-shadow:var(--shadow)}
.notes ul{margin:0;padding-left:19px}
.notes li{margin-bottom:7px;color:var(--ink-2);font-size:14px}
.notes li:last-child{margin-bottom:0}
.nota{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;
  padding:11px 15px;margin:0 0 16px;max-width:82ch}

.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-3)}
@media (max-width:620px){
  .hbar{grid-template-columns:96px 1fr auto;gap:8px}
  .kpi .v{font-size:21px}
}
</style>

<script>
/* ------------------------------------------------------------ formatação */
const nf0 = new Intl.NumberFormat("pt-BR", {maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => (v==null ? "—" : nf0.format(v));
const brl = v => (v==null ? "—" : "R$ " + nf2.format(v));
const pct = v => (v==null ? "—" : nf2.format(v).replace(",00","") + "%");
const seg = v => (v==null ? "—" : num(v) + "s");

function dm(iso){ if(!iso) return ""; const [a,m,d]=iso.split("-"); return `${d}/${m}`; }

/* variação: `inverso` para métricas onde menor é melhor (CPC, CPA, custo) */
function delta(atual, anterior, inverso){
  if(atual==null || anterior==null || anterior===0) return null;
  const p = ((atual - anterior) / Math.abs(anterior)) * 100;
  const bom = inverso ? p < 0 : p > 0;
  return { p, cls: Math.abs(p) < 0.5 ? "flat" : (bom ? "up" : "down"),
           txt: (p>0?"↑ ":p<0?"↓ ":"") + nf2.format(Math.abs(p)).replace(",00","") + "%" };
}

function kpi(label, valor, d, sub){
  const dd = d ? `<span class="d ${d.cls}">${d.txt}</span>` : "";
  const ss = sub ? `<div class="sub">${sub}</div>` : "";
  return `<div class="kpi"><div class="l">${label}</div><div class="v">${valor}</div>${dd}${ss}</div>`;
}

function hbars(itens, opts={}){
  const max = Math.max(...itens.map(i=>i.valor), 1);
  return `<div class="hbars" style="--lw:${opts.lw||132}px">` + itens.map(i=>`
    <div class="hbar ${i.alerta?"alerta":""}">
      <span class="nm" title="${i.nome}">${i.nome}</span>
      <span class="track"><span class="fill" style="width:${Math.max((i.valor/max)*100,1.2)}%;${i.cor?`background:${i.cor}`:""}"></span></span>
      <span class="vl">${i.rotulo}</span>
    </div>`).join("") + `</div>`;
}

function vbars(itens, fmt){
  const max = Math.max(...itens.map(i=>i.valor), 1);
  return `<div class="vbars">` + itens.map(i=>`
    <div class="vbar" title="${i.rotulo}: ${fmt(i.valor)}">
      <span class="vv">${fmt(i.valor)}</span>
      <span class="col" style="height:${Math.max((i.valor/max)*100,2)}%;${i.cor?`background:${i.cor}`:""}"></span>
      <span class="lb">${i.rotulo}</span>
    </div>`).join("") + `</div>`;
}

/* linha comparando dois períodos, no formato do relatório antigo */
function linhasComparadas(defs, atual, anterior){
  return defs.map(d=>{
    const va = atual ? atual[d.k] : null, vb = anterior ? anterior[d.k] : null;
    const dd = delta(va, vb, d.inv);
    return `<tr>
      <td class="nm">${d.rot}</td>
      <td class="r">${d.f(va)}</td>
      <td class="r mini">${d.f(vb)}</td>
      <td class="r">${dd ? `<span class="d ${dd.cls}" style="font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px">${dd.txt}</span>` : "—"}</td>
    </tr>`;
  }).join("");
}

function totaisMidia(){
  const g = DADOS.google.campanhas.reduce((a,c)=>({
    custo:a.custo+c.atual.custo, cliques:a.cliques+c.atual.cliques,
    impressoes:a.impressoes+c.atual.impressoes, conversoes:a.conversoes+c.atual.conversoes
  }), {custo:0,cliques:0,impressoes:0,conversoes:0});
  const gAnt = DADOS.google.campanhas.reduce((a,c)=>({
    custo:a.custo+c.anterior.custo, cliques:a.cliques+c.anterior.cliques,
    impressoes:a.impressoes+c.anterior.impressoes, conversoes:a.conversoes+c.anterior.conversoes
  }), {custo:0,cliques:0,impressoes:0,conversoes:0});

  const m = DADOS.meta.objetivos.reduce((a,o)=>({
    custo:a.custo+o.atual.gasto, cliques:a.cliques+o.atual.cliques, impressoes:a.impressoes+o.atual.impressoes
  }), {custo:0,cliques:0,impressoes:0});
  const mAnt = DADOS.meta.objetivos.reduce((a,o)=>({
    custo:a.custo+o.anterior.gasto, cliques:a.cliques+o.anterior.cliques, impressoes:a.impressoes+o.anterior.impressoes
  }), {custo:0,cliques:0,impressoes:0});

  const o = DADOS.openai.atual || {gasto:0,cliques:0,impressoes:0,conversoes:0};
  const oAnt = DADOS.openai.anterior;

  return {
    google:{...g, nome:"Google Ads", cor:"var(--c-google)"},
    googleAnt:gAnt,
    meta:{...m, nome:"Meta Ads", cor:"var(--c-meta)"},
    metaAnt:mAnt,
    openai:{custo:o.gasto, cliques:o.cliques, impressoes:o.impressoes, conversoes:o.conversoes,
            nome:"OpenAI Ads", cor:"var(--c-openai)"},
    openaiAnt: oAnt ? {custo:oAnt.gasto, cliques:oAnt.cliques} : null,
    invTotal: g.custo + m.custo + o.gasto,
    invTotalAnt: gAnt.custo + mAnt.custo + (oAnt?oAnt.gasto:0),
    cliquesTotal: g.cliques + m.cliques + o.cliques,
    cliquesTotalAnt: gAnt.cliques + mAnt.cliques + (oAnt?oAnt.cliques:0)
  };
}

const tablist = document.getElementById("tablist");

  const b = document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=ab.nome;

function selecionar(id){
  ABAS.forEach(ab=>{
    const ativo = ab.id===id;
    document.getElementById("tab-"+ab.id).setAttribute("aria-selected", ativo?"true":"false");
    document.getElementById("p-"+ab.id).hidden = !ativo;
  });
  try{ localStorage.setItem("painel:aba", id); }catch(e){}
}

function renderTudo(){
  ABAS.forEach(ab=>{ document.getElementById("p-"+ab.id).innerHTML = ab.render(); });
  document.getElementById("brand").innerHTML =
    `${DADOS.marca}<small>Painel de mídia e negócio</small>`;
}

/* período — muda os rótulos e recalcula automaticamente o período de comparação */
const inDe = document.getElementById("de"), inAte = document.getElementById("ate");
const elVs = document.getElementById("vs");

function diasEntre(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function menos(iso, dias){
  const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()-dias);
  return d.toISOString().slice(0,10);
}

function atualizarPeriodo(){
  const de = inDe.value, ate = inAte.value;
  if(!de || !ate || de > ate){ elVs.textContent = ""; return; }
  const span = diasEntre(de, ate);
  const antAte = menos(de, 1), antDe = menos(antAte, span);
  DADOS.periodo.atual = {de, ate};
  DADOS.periodo.anterior = {de:antDe, ate:antAte};
  elVs.textContent = `${dm(de)} – ${dm(ate)}  ·  compara com ${dm(antDe)} – ${dm(antAte)}`;
}

inDe.value = DADOS.periodo.atual.de;
inAte.value = DADOS.periodo.atual.ate;
inDe.addEventListener("change", atualizarPeriodo);
inAte.addEventListener("change", atualizarPeriodo);
atualizarPeriodo();
renderTudo();

const rodape = document.createElement("div");
rodape.className = "foot";
rodape.textContent = "Meta Ads · Google Ads · OpenAI Ads · Microsoft Clarity · GA4 · Metabase";
main.appendChild(rodape);

try{
  const salva = localStorage.getItem("painel:aba");
  if(salva && ABAS.some(a=>a.id===salva)) selecionar(salva);
}catch(e){}
