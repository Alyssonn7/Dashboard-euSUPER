<title>Painel Semanal Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Asap:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap">

<style>
/* ===========================================================================
   O caderno de agendamento da Mia.
   Trilho de rótulos à esquerda, conteúdo escrito sobre linhas pautadas,
   linha de chamada pontilhada ligando rótulo e número.
   =========================================================================== */
:root{
  --tinta:#10243F;      /* azul de caneta — texto e capa */
  --tinta-2:#41556F;
  --tinta-3:#76889E;
  --papel:#F1F4F9;      /* papel frio */
  --papel-2:#E5EBF4;    /* trilho / faixa */
  --linha:#CDD8E8;      /* a linha pautada */
  --linha-2:#DFE6F1;
  --mia:#004AAD;        /* o azul da marca */
  --pago:#00693F;       /* deu certo */
  --furo:#A82F26;       /* furo na agenda */
  --pago-t:#E0EFE7;
  --furo-t:#F7E4E2;
  --c-meta:#2563EB;
  --c-google:#D14009;
  --c-openai:#00875A;
  --capa:#10243F;
  --capa-ink:#FFFFFF;
  --capa-ink-2:rgba(255,255,255,.62);
  --capa-linha:rgba(255,255,255,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tinta:#E4ECF8; --tinta-2:#A7B8CF; --tinta-3:#74879F;
    --papel:#0B1522; --papel-2:#142235; --linha:#283A52; --linha-2:#1D2C41;
    --mia:#83ADF2; --pago:#4CC78D; --furo:#EF8B81;
    --pago-t:#0E2B1F; --furo-t:#331A18;
    --c-meta:#5C93F0; --c-google:#EA7B4A; --c-openai:#3BB584;
    --capa:#060D17; --capa-ink:#EEF3FB; --capa-ink-2:rgba(238,243,251,.6);
    --capa-linha:rgba(238,243,251,.14);
  }
}
:root[data-theme="dark"]{
  --tinta:#E4ECF8; --tinta-2:#A7B8CF; --tinta-3:#74879F;
  --papel:#0B1522; --papel-2:#142235; --linha:#283A52; --linha-2:#1D2C41;
  --mia:#83ADF2; --pago:#4CC78D; --furo:#EF8B81;
  --pago-t:#0E2B1F; --furo-t:#331A18;
  --c-meta:#5C93F0; --c-google:#EA7B4A; --c-openai:#3BB584;
  --capa:#060D17; --capa-ink:#EEF3FB; --capa-ink-2:rgba(238,243,251,.6);
  --capa-linha:rgba(238,243,251,.14);
}

*{box-sizing:border-box}
body{
  background:var(--papel); color:var(--tinta);
  font-family:"Asap",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace}
.disp{font-family:"Bricolage Grotesque","Asap",sans-serif}

/* ------------------------------------------------------------------- capa */
.capa{background:var(--capa);color:var(--capa-ink);padding:26px 0 0}
.capa-in{max-width:1120px;margin:0 auto;padding:0 26px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:26px;flex-wrap:wrap}
.marca{font-family:"Bricolage Grotesque","Asap",sans-serif;font-weight:800;
  font-size:27px;letter-spacing:-.025em;line-height:1;color:var(--capa-ink)}
.marca em{display:block;font-family:"Spline Sans Mono",monospace;font-style:normal;
  font-weight:400;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--capa-ink-2);margin-top:9px}
.quando{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-family:"Spline Sans Mono",monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.19em;text-transform:uppercase;color:var(--capa-ink-2)}
.campo input{
  font-family:"Spline Sans Mono",monospace;font-size:13px;
  padding:7px 10px;border:1px solid var(--capa-linha);border-radius:3px;
  background:rgba(255,255,255,.08);color:var(--capa-ink);color-scheme:dark;
}
.campo input:focus-visible{outline:2px solid var(--capa-ink);outline-offset:1px}
.contra{font-family:"Spline Sans Mono",monospace;font-size:11.5px;
  color:var(--capa-ink-2);padding-bottom:9px;line-height:1.5;max-width:22ch}

/* -------------------------------------------------------- abas de fichário */
.fichario{max-width:1120px;margin:22px auto 0;padding:0 18px;
  display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.fichario::-webkit-scrollbar{display:none}
.aba{
  font-family:"Spline Sans Mono",monospace;font-size:11.5px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;
  padding:11px 15px 12px;color:var(--capa-ink-2);white-space:nowrap;cursor:pointer;
  border:none;background:rgba(255,255,255,.05);border-radius:5px 5px 0 0;
  border-bottom:3px solid transparent;
}
.aba:hover{color:var(--capa-ink);background:rgba(255,255,255,.11)}
.aba[aria-selected="true"]{
  background:var(--papel);color:var(--mia);font-weight:600;border-bottom-color:var(--papel);
}
.aba:focus-visible{outline:2px solid var(--capa-ink);outline-offset:-3px}

main{max-width:1120px;margin:0 auto;padding:34px 26px 96px}
.folha[hidden]{display:none}

/* --------------------------------------------------------------- cabeçalhos */
.bloco{margin:0 0 42px}
.titulo{font-family:"Bricolage Grotesque","Asap",sans-serif;font-weight:700;
  font-size:22px;letter-spacing:-.022em;margin:0 0 5px;line-height:1.16}
.legenda{color:var(--tinta-2);font-size:14px;margin:0 0 22px;max-width:74ch}
.rotulo{font-family:"Spline Sans Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-3);
  padding-bottom:9px;border-bottom:2px solid var(--tinta);margin-bottom:4px;
  display:block}

/* ------------------------------------------------------------- o veredito */
.veredito{
  display:grid;grid-template-columns:132px 1fr;gap:0 22px;align-items:start;
  border-top:2px solid var(--tinta);border-bottom:1px solid var(--linha);
  padding:18px 0 22px;margin-bottom:38px;
}
.veredito .marg{font-family:"Spline Sans Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.17em;text-transform:uppercase;color:var(--mia);padding-top:5px}
.veredito p{margin:0;font-size:16.5px;line-height:1.62;max-width:64ch;color:var(--tinta)}

/* ------------------------------------------- a linha da agenda (assinatura) */
.linhas{border-top:1px solid var(--linha);margin:0 0 6px}
.linha{
  display:grid;grid-template-columns:minmax(118px,auto) 1fr auto minmax(78px,auto);
  gap:0 12px;align-items:baseline;
  padding:13px 0 12px;border-bottom:1px solid var(--linha-2);
}
.linha:hover{background:var(--papel-2)}
.linha .lb{font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:var(--tinta-2);white-space:nowrap}
.linha .chamada{border-bottom:1px dotted var(--linha);height:.72em;min-width:14px}
.linha .vl{font-family:"Bricolage Grotesque","Asap",sans-serif;font-weight:700;
  font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  color:var(--tinta);white-space:nowrap}
.linha .var{font-family:"Spline Sans Mono",monospace;font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.linha .var.up{color:var(--pago)} .linha .var.down{color:var(--furo)}
.linha .var.flat{color:var(--tinta-3)}
.linha .nota{grid-column:1/-1;font-size:12.5px;color:var(--tinta-3);
  margin-top:5px;padding-left:0}
.linhas.solta .linha:last-child{border-bottom:1px solid var(--linha)}

/* ------------------------------------------------------------ blocos vagos */
.slots{border-top:1px solid var(--linha)}
.slot{
  display:grid;grid-template-columns:minmax(112px,auto) 1fr minmax(112px,auto);
  gap:0 14px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--linha-2);
}
.slot .nm{font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .faixa{display:block;height:19px;background:var(--papel-2);position:relative;
  border-radius:2px;overflow:hidden}
.slot .ocupado{display:block;height:100%;background:var(--mia);border-radius:2px;
  min-width:3px;transition:width .4s cubic-bezier(.22,.61,.36,1)}
.slot .qt{font-family:"Spline Sans Mono",monospace;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;text-align:right;color:var(--tinta);white-space:nowrap}
.slot.furado .ocupado{background:var(--furo)}
.slot.furado .nm,.slot.furado .qt{color:var(--furo)}

/* ------------------------------------------------------------- colunas dia */
.dias{display:flex;align-items:flex-end;gap:12px;height:158px;
  border-bottom:1px solid var(--linha);padding-bottom:0}
.dia{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:7px;height:100%}
.dia .col{width:100%;max-width:56px;background:var(--mia);min-height:3px;
  border-radius:2px 2px 0 0;transition:height .4s cubic-bezier(.22,.61,.36,1)}
.dia .n{font-family:"Bricolage Grotesque","Asap",sans-serif;font-weight:700;font-size:12.5px;
  font-variant-numeric:tabular-nums;color:var(--tinta)}
.diasl{display:flex;gap:12px;margin-top:8px}
.diasl span{flex:1;text-align:center;font-family:"Spline Sans Mono",monospace;
  font-size:10.5px;color:var(--tinta-3)}

/* ------------------------------------------------------------------ pautas */
.pauta{border-top:2px solid var(--tinta)}
.par{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:38px}
.quadro{min-width:0}
.quadro .titulo{font-size:15px;margin-bottom:3px}
.quadro .legenda{font-size:12.5px;margin-bottom:16px}
.chave{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:13px}
.chave span{display:inline-flex;align-items:center;gap:6px;
  font-family:"Spline Sans Mono",monospace;font-size:10.5px;color:var(--tinta-2)}
.chave i{width:9px;height:9px;border-radius:1px;flex:none}

/* ------------------------------------------------------------------ tabela */
.tw{overflow-x:auto;border-top:2px solid var(--tinta)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{font-family:"Spline Sans Mono",monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--tinta-3);
  text-align:left;padding:10px 13px 10px 0;border-bottom:1px solid var(--linha);
  white-space:nowrap}
thead th.r{text-align:right}
tbody td{padding:12px 13px 12px 0;border-bottom:1px solid var(--linha-2);
  color:var(--tinta-2);white-space:nowrap;
  font-family:"Spline Sans Mono",monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums}
tbody td.r{text-align:right}
tbody td.nm{font-family:"Asap",sans-serif;font-size:14px;font-weight:600;color:var(--tinta)}
tbody tr:hover td{background:var(--papel-2)}
tfoot td{padding:12px 13px 12px 0;border-top:1px solid var(--linha);
  font-family:"Spline Sans Mono",monospace;font-size:12.5px;font-weight:600;
  color:var(--tinta);white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td.r{text-align:right}
tfoot td.nm{font-family:"Asap",sans-serif;font-size:13.5px}
td .sub{display:block;font-family:"Spline Sans Mono",monospace;font-size:10.5px;
  color:var(--tinta-3);margin-top:2px}

/* --------------------------------------------------------------- anotações */
.anot{border-top:1px solid var(--linha);padding-top:4px}
.anot p{display:grid;grid-template-columns:22px 1fr;gap:12px;margin:0;
  padding:13px 0;border-bottom:1px solid var(--linha-2);
  font-size:14.5px;color:var(--tinta-2);max-width:none}
.anot p b{font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:500;
  color:var(--mia);padding-top:3px}
.anot p span{max-width:74ch}

/* sequência real — só aqui a numeração diz algo */
.passos{list-style:none;counter-reset:p;padding:0;margin:0;border-top:2px solid var(--tinta)}
.passos li{counter-increment:p;display:grid;grid-template-columns:52px 1fr;gap:16px;
  padding:19px 0;border-bottom:1px solid var(--linha-2);
  font-size:15px;color:var(--tinta-2)}
.passos li::before{content:counter(p,decimal-leading-zero);
  font-family:"Bricolage Grotesque","Asap",sans-serif;font-weight:800;font-size:19px;
  color:var(--linha);line-height:1.05}
.passos li span{max-width:70ch}

.aviso{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--tinta-2);
  background:var(--papel-2);border-left:2px solid var(--mia);
  padding:11px 15px;margin:0 0 20px;max-width:78ch;line-height:1.6}
.rodape{margin-top:52px;padding-top:16px;border-top:1px solid var(--linha);
  font-family:"Spline Sans Mono",monospace;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tinta-3)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){
  .veredito{grid-template-columns:1fr;gap:10px}
  .veredito p{font-size:15.5px}
  .linha{grid-template-columns:1fr auto;row-gap:2px}
  .linha .chamada{display:none}
  .linha .var{grid-column:2}
  .par{gap:30px}
  .marca{font-size:23px}
}

  proximosPassos: [

    "Acompanhar diariamente o desempenho da nova campanha durante o período de aprendizado.",
    "Comparar os resultados com a campanha anterior após a conclusão da fase de aprendizado.",
    "Analisar as campanhas de vídeo para o YouTube."
  ]
};
/* ===================== fim dos dados da semana ===================== */
</script>

    </div>

</div>

<main id="main"></main>

<script>
/* ------------------------------------------------------------- formatação */
const nf0 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => v==null ? "—" : nf0.format(v);
const brl = v => v==null ? "—" : "R$ " + nf2.format(v);
const pct = v => v==null ? "—" : nf2.format(v).replace(",00","") + "%";
const seg = v => v==null ? "—" : num(v) + "s";
const dm  = iso => { if(!iso) return ""; const [a,m,d]=iso.split("-"); return `${d}/${m}`; };

/* variação — `inverso` para métricas em que cair é bom (custo, CPC, CPA) */
function variacao(atual, anterior, inverso){
  if(atual==null || anterior==null || anterior===0) return null;
  const p = ((atual - anterior) / Math.abs(anterior)) * 100;
  const bom = inverso ? p < 0 : p > 0;
  return { cls: Math.abs(p) < 0.5 ? "flat" : (bom ? "up" : "down"),
           txt: (p>0?"+":p<0?"−":"") + nf2.format(Math.abs(p)).replace(",00","") + "%" };
}

/* a linha da agenda: rótulo · chamada pontilhada · valor · variação */
function linha(lb, vl, v, nota){
  return `<div class="linha">
    <span class="lb">${lb}</span>
    <span class="chamada"></span>
    <span class="vl">${vl}</span>
    <span class="var ${v?v.cls:"flat"}">${v?v.txt:"—"}</span>
    ${nota?`<span class="nota">${nota}</span>`:""}
  </div>`;
}
const linhas = (html, solta) => `<div class="linhas ${solta?"solta":""}">${html}</div>`;

/* horários ocupados: a barra é a proporção, o número é o absoluto */
function slots(itens){
  const max = Math.max(...itens.map(i=>i.valor), 1);
  return `<div class="slots">` + itens.map(i=>`
    <div class="slot ${i.furado?"furado":""}">
      <span class="nm" title="${i.nome}">${i.nome}</span>
      <span class="faixa"><span class="ocupado" style="width:${Math.max((i.valor/max)*100,1.4)}%${i.cor?`;background:${i.cor}`:""}"></span></span>
      <span class="qt">${i.rotulo}</span>
    </div>`).join("") + `</div>`;
}

/* colunas por dia */
function dias(itens, fmt){
  const max = Math.max(...itens.map(i=>i.valor), 1);
  return `<div class="dias">` + itens.map(i=>`
    <div class="dia" title="${i.rotulo}: ${fmt(i.valor)}">
      <span class="n">${fmt(i.valor)}</span>
      <span class="col" style="height:${Math.max((i.valor/max)*100,2)}%${i.cor?`;background:${i.cor}`:""}"></span>
    </div>`).join("") + `</div>
    <div class="diasl">${itens.map(i=>`<span>${i.rotulo}</span>`).join("")}</div>`;
}

/* ---------------------------------------------------------------- as folhas */
const FOLHAS = [
  { id:"geral",   nome:"A semana",     render:folhaGeral },
  { id:"openai",  nome:"OpenAI Ads",   render:folhaOpenAI },
  { id:"meta",    nome:"Meta Ads",     render:folhaMeta },
  { id:"google",  nome:"Google Ads",   render:folhaGoogle },
  { id:"lp",      nome:"A página",     render:folhaLP },
  { id:"negocio", nome:"O negócio",    render:folhaNegocio },
  { id:"passos",  nome:"O que vem",    render:folhaPassos }
];

function somaMidia(){
  const soma = (arr, get) => arr.reduce((s,x)=>{
    const o = get(x); return { custo:s.custo+o.custo, cliques:s.cliques+o.cliques,
      impressoes:s.impressoes+o.impressoes };
  }, {custo:0,cliques:0,impressoes:0});

  const g   = soma(DADOS.google.campanhas, c=>({custo:c.atual.custo,cliques:c.atual.cliques,impressoes:c.atual.impressoes}));
  const gA  = soma(DADOS.google.campanhas, c=>({custo:c.anterior.custo,cliques:c.anterior.cliques,impressoes:c.anterior.impressoes}));
  const m   = soma(DADOS.meta.objetivos,  o=>({custo:o.atual.gasto,cliques:o.atual.cliques,impressoes:o.atual.impressoes}));
  const mA  = soma(DADOS.meta.objetivos,  o=>({custo:o.anterior.gasto,cliques:o.anterior.cliques,impressoes:o.anterior.impressoes}));
  const o   = DADOS.openai.atual    || {gasto:0,cliques:0,impressoes:0};
  const oA  = DADOS.openai.anterior;

  return {
    canais:[
      {nome:"Google Ads", custo:g.custo, cliques:g.cliques, cor:"var(--c-google)"},
      {nome:"Meta Ads",   custo:m.custo, cliques:m.cliques, cor:"var(--c-meta)"},
      {nome:"OpenAI Ads", custo:o.gasto, cliques:o.cliques, cor:"var(--c-openai)"}
    ],
    invest:g.custo+m.custo+o.gasto,
    investA:gA.custo+mA.custo+(oA?oA.gasto:0),
    cliques:g.cliques+m.cliques+o.cliques,
    cliquesA:gA.cliques+mA.cliques+(oA?oA.cliques:0)
  };
}

/* ----------------------------------------------------------------- a semana */
function folhaGeral(){
  const t = somaMidia(), n = DADOS.negocio;
  const cpc  = n.atual.cadastros    ? t.invest  / n.atual.cadastros    : null;
  const cpcA = n.anterior.cadastros ? t.investA / n.anterior.cadastros : null;

  const f = n.funil;
  const taxas = f.map((e,i)=> i===0 ? 100 : (f[i-1].valor>0 ? (e.valor/f[i-1].valor)*100 : 0));
  let pior=-1, min=Infinity;
  taxas.forEach((x,i)=>{ if(i>0 && x<min){ min=x; pior=i; } });

  return `
  <div class="veredito">
    <span class="marg">O que aconteceu</span>
    <p>${DADOS.veredito}</p>
  </div>

  <div class="bloco">
    <span class="rotulo">Os números da semana</span>
    ${linhas(
      linha("Investimento", brl(t.invest), variacao(t.invest, t.investA, true)) +
      linha("Cliques",      num(t.cliques), variacao(t.cliques, t.cliquesA)) +
      linha("Cadastros",    num(n.atual.cadastros), variacao(n.atual.cadastros, n.anterior.cadastros)) +
      linha("Por cadastro", brl(cpc), variacao(cpc, cpcA, true),
            "Investimento total dividido pelos cadastros. Consolidado — não separa quanto veio de cada canal.") +
      linha("GMV",          brl(n.atual.gmv), variacao(n.atual.gmv, n.anterior.gmv)) +
      linha("Contas ativas", num(n.atual.contasAtivas), variacao(n.atual.contasAtivas, n.anterior.contasAtivas),
            "Profissionais com a conta de pagamento aprovada — é a etapa que trava o faturamento."),
      true)}
  </div>

  <div class="bloco par">
    <div class="quadro">
      <h3 class="titulo">Para onde foi o dinheiro</h3>
      <p class="legenda">Quanto cada canal consumiu no período.</p>
      <div class="chave">${t.canais.map(c=>`<span><i style="background:${c.cor}"></i>${c.nome}</span>`).join("")}</div>
      ${slots(t.canais.map(c=>({nome:c.nome, valor:c.custo, rotulo:brl(c.custo), cor:c.cor})))}
    </div>
    <div class="quadro">
      <h3 class="titulo">Quanto custou cada clique</h3>
      <p class="legenda">Gasto do canal dividido pelos cliques dele. Menor é melhor.</p>
      <div class="chave">${t.canais.map(c=>`<span><i style="background:${c.cor}"></i>${c.nome}</span>`).join("")}</div>
      ${slots(t.canais.map(c=>({nome:c.nome, valor:c.cliques?c.custo/c.cliques:0,
        rotulo:brl(c.cliques?c.custo/c.cliques:null), cor:c.cor})))}
    </div>
  </div>

  <div class="bloco">
    <span class="rotulo">Da impressão ao primeiro pagamento</span>
    <p class="legenda" style="margin-top:14px">A barra mostra quanto <strong>passou</strong> da etapa
    anterior, não o volume — é assim que o estrangulamento aparece. A etapa que mais perde gente fica marcada.</p>
    ${slots(f.map((e,i)=>({
      nome: e.etapa,
      valor: taxas[i],
      rotulo: i===0 ? num(e.valor)
                    : `${num(e.valor)} <em style="font-style:normal;color:var(--tinta-3)">·</em> ${nf2.format(taxas[i]).replace(",00","")}%`,
      furado: i===pior
    })))}
  </div>`;
}

/* ---------------------------------------------------------------- OpenAI Ads */
function folhaOpenAI(){
  const a = DADOS.openai.atual, b = DADOS.openai.anterior;
  return `
  <div class="bloco">
    <h2 class="titulo">OpenAI Ads</h2>
    <p class="legenda">${DADOS.openai.nota}</p>
    ${b ? "" : `<p class="aviso">Primeiro período medido neste canal. Ainda não há período anterior para comparar.</p>`}
    ${linhas(
      linha("Impressões",   num(a.impressoes),  variacao(a.impressoes, b&&b.impressoes)) +
      linha("Cliques",      num(a.cliques),     variacao(a.cliques, b&&b.cliques)) +
      linha("Conversões",   num(a.conversoes),  variacao(a.conversoes, b&&b.conversoes)) +
      linha("Gasto",        brl(a.gasto),       variacao(a.gasto, b&&b.gasto, true)) +
      linha("Por conversão",brl(a.cpa),         variacao(a.cpa, b&&b.cpa, true)) +
      linha("Por clique",   brl(a.cpc),         variacao(a.cpc, b&&b.cpc, true)),
      true)}
  </div>

  <div class="bloco par">
    <div class="quadro">
      <h3 class="titulo">Cliques por dia</h3>
      <p class="legenda">Como a entrega evoluiu ao longo do período.</p>
      ${dias(DADOS.openai.serie.map(d=>({rotulo:d.data, valor:d.cliques, cor:"var(--c-openai)"})), num)}
    </div>
    <div class="quadro">
      <h3 class="titulo">Conversões por dia</h3>
      <p class="legenda">Cadastros que a própria plataforma atribuiu.</p>
      ${dias(DADOS.openai.serie.map(d=>({rotulo:d.data, valor:d.conversoes, cor:"var(--c-openai)"})), num)}

}

/* ------------------------------------------------------------------ Meta Ads */
function folhaMeta(){
  return DADOS.meta.objetivos.map(o=>{
    const a=o.atual, b=o.anterior, perfil = "resultados" in a;

    const cols = perfil
      ? [["Gasto",c=>brl(c.gasto)],["Alcance",c=>num(c.alcance)],["Impressões",c=>num(c.impressoes)],
         ["CPM",c=>brl(c.cpm)],["CTR",c=>pct(c.ctr)],["Cliques",c=>num(c.cliques)],
         ["Resultados",c=>num(c.resultados)],["Por result.",c=>brl(c.custoResultado)]]
      : [["Gasto",c=>brl(c.gasto)],["Alcance",c=>num(c.alcance)],["Impressões",c=>num(c.impressoes)],
         ["CPM",c=>brl(c.cpm)],["CTR",c=>pct(c.ctr)],["Cliques",c=>num(c.cliques)],
         ["Visitas na página",c=>num(c.visitasLP)],["Connect Rate",c=>pct(c.connectRate)]];

    const resumo = perfil
      ? linha("Gasto", brl(a.gasto), variacao(a.gasto,b.gasto,true)) +
        linha("Impressões", num(a.impressoes), variacao(a.impressoes,b.impressoes)) +
        linha("CTR", pct(a.ctr), variacao(a.ctr,b.ctr)) +
        linha("Resultados", num(a.resultados), variacao(a.resultados,b.resultados)) +
        linha("Por resultado", brl(a.custoResultado), variacao(a.custoResultado,b.custoResultado,true))
      : linha("Gasto", brl(a.gasto), variacao(a.gasto,b.gasto,true)) +
        linha("Impressões", num(a.impressoes), variacao(a.impressoes,b.impressoes)) +
        linha("CTR", pct(a.ctr), variacao(a.ctr,b.ctr)) +
        linha("Visitas na página", num(a.visitasLP), variacao(a.visitasLP,b.visitasLP)) +
        linha("Connect Rate", pct(a.connectRate), variacao(a.connectRate,b.connectRate),
              "Fatia dos cliques que virou visita de verdade na página.");

    const ordem = [...o.criativos].sort((x,y)=>y.gasto-x.gasto);

    return `
    <div class="bloco">
      <h2 class="titulo">Objetivo: ${o.nome}</h2>
      <p class="legenda">${o.criativos.length} ${o.criativos.length===1?"anúncio":"anúncios"} rodaram no período.</p>
      ${linhas(resumo, true)}
    </div>
    <div class="bloco">
      <span class="rotulo">Anúncio por anúncio</span>
      <div class="tw">
        <table>
          <thead><tr><th>Anúncio</th>${cols.map(c=>`<th class="r">${c[0]}</th>`).join("")}</tr></thead>
          <tbody>${ordem.map(c=>`<tr><td class="nm">${c.nome}</td>${cols.map(k=>`<td class="r">${k[1](c)}</td>`).join("")}</tr>`).join("")}</tbody>
          <tfoot><tr><td class="nm">Total</td>${cols.map(k=>`<td class="r">${k[1](a)}</td>`).join("")}</tr></tfoot>
        </table>
      </div>
    </div>`;
  }).join("");
}

/* ---------------------------------------------------------------- Google Ads */
function folhaGoogle(){
  const defs = [
    {k:"impressoes",     rot:"Impressões",   f:num},
    {k:"cliques",        rot:"Cliques",      f:num},
    {k:"ctr",            rot:"CTR",          f:pct},
    {k:"cpc",            rot:"CPC médio",    f:brl, inv:true},
    {k:"conversoes",     rot:"Conversões",   f:num},
    {k:"taxaConversao",  rot:"Taxa de conv.",f:pct},
    {k:"custoConversao", rot:"Por conversão",f:brl, inv:true},
    {k:"custo",          rot:"Custo",        f:brl, inv:true}
  ];
  const total = DADOS.google.campanhas.reduce((s,c)=>s+c.atual.custo,0);

  return `
  <div class="bloco">
    <h2 class="titulo">Google Ads</h2>
    <p class="legenda">Cada campanha contra o período anterior. O canal consumiu
      <strong>${brl(total)}</strong> no total — as três campanhas somadas, não só a de Pesquisa.</p>
  </div>
  ${DADOS.google.campanhas.map(c=>`
    <div class="bloco">
      <span class="rotulo">${c.nome}</span>
      ${c.nota?`<p class="aviso" style="margin-top:16px">${c.nota}</p>`:""}
      <div class="tw" style="border-top:none">
        <table>
          <thead><tr><th>Métrica</th><th class="r">Este período</th><th class="r">Anterior</th><th class="r">Variação</th></tr></thead>
          <tbody>${defs.map(d=>{
            const va=c.atual[d.k], vb=c.anterior[d.k], vr=variacao(va,vb,d.inv);
            return `<tr>
              <td class="nm">${d.rot}</td>
              <td class="r">${d.f(va)}</td>
              <td class="r" style="color:var(--tinta-3)">${d.f(vb)}</td>
              <td class="r" style="color:${vr? (vr.cls==="up"?"var(--pago)":vr.cls==="down"?"var(--furo)":"var(--tinta-3)") :"var(--tinta-3)"}">${vr?vr.txt:"—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </div>`).join("")}
  <div class="bloco">
    <span class="rotulo">O que as pessoas pesquisaram</span>
    <div class="tw" style="border-top:none">
      <table>
        <thead><tr><th>Termo</th><th class="r">Impressões</th><th class="r">Cliques</th><th class="r">Custo</th><th class="r">Conversões</th></tr></thead>
        <tbody>${DADOS.google.termos.map(t=>`<tr>
          <td class="nm">${t.termo}</td><td class="r">${num(t.impressoes)}</td>
          <td class="r">${num(t.cliques)}</td><td class="r">${brl(t.custo)}</td>
          <td class="r">${num(t.conversoes)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- o negócio */

/* ---------------------------------------------------------------- o que vem */
function folhaPassos(){
  return `
  <div class="bloco">
    <h2 class="titulo">O que fica decidido</h2>
    <p class="legenda">Para a semana que começa, em ordem de execução.</p>

/* ---------------------------------------------------------------- montagem */
const fichario = document.getElementById("fichario");
const main = document.getElementById("main");

FOLHAS.forEach((fo,i)=>{
  const b = document.createElement("button");
  b.className="aba"; b.type="button"; b.textContent=fo.nome;
  b.id="aba-"+fo.id; b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.setAttribute("aria-controls","fo-"+fo.id);
  b.addEventListener("click", ()=>abrir(fo.id));
  fichario.appendChild(b);

  const s = document.createElement("section");
  s.className="folha"; s.id="fo-"+fo.id;
  s.setAttribute("role","tabpanel"); s.setAttribute("aria-labelledby","aba-"+fo.id);
  if(i>0) s.hidden=true;
  main.appendChild(s);
});

function abrir(id){
  FOLHAS.forEach(fo=>{
    const ativo = fo.id===id;
    document.getElementById("aba-"+fo.id).setAttribute("aria-selected", ativo?"true":"false");
    document.getElementById("fo-"+fo.id).hidden = !ativo;
  });
  try{ localStorage.setItem("agenda:folha", id); }catch(e){}
}

function desenhar(){
  FOLHAS.forEach(fo=>{ document.getElementById("fo-"+fo.id).innerHTML = fo.render(); });
  document.getElementById("marca").innerHTML = `${DADOS.marca}<em>agenda da semana</em>`;
}

/* período — recalcula sozinho o intervalo de comparação */
const inDe = document.getElementById("de"), inAte = document.getElementById("ate");
const elContra = document.getElementById("contra");
const dias_ = (a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const menos = (iso,d)=>{ const x=new Date(iso+"T12:00:00"); x.setDate(x.getDate()-d);
  return x.toISOString().slice(0,10); };

function periodo(){
  const de=inDe.value, ate=inAte.value;
  if(!de||!ate||de>ate){ elContra.textContent=""; return; }
  const vao = dias_(de,ate), antAte = menos(de,1), antDe = menos(antAte,vao);
  DADOS.periodo.atual={de,ate};
  DADOS.periodo.anterior={de:antDe,ate:antAte};
  elContra.textContent = `${dm(de)}–${dm(ate)} contra ${dm(antDe)}–${dm(antAte)}`;
}

inDe.value = DADOS.periodo.atual.de;
inAte.value = DADOS.periodo.atual.ate;
inDe.addEventListener("change", periodo);
inAte.addEventListener("change", periodo);
periodo();
desenhar();

const pe = document.createElement("div");
pe.className="rodape";
pe.textContent="Meta Ads · Google Ads · OpenAI Ads · Microsoft Clarity · GA4 · Metabase";
main.appendChild(pe);

try{
  const salva = localStorage.getItem("agenda:folha");
  if(salva && FOLHAS.some(f=>f.id===salva)) abrir(salva);
}catch(e){}
</script>
